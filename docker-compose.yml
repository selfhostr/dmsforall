# dmsforall, complete stack from published images: PostgreSQL, Valkey, API, background worker,
# web (HTTPS) and a daily backup.
#
#   curl -LO https://github.com/selfhostr/dmsforall/releases/latest/download/docker-compose.yml
#   docker compose up -d
#
# Then open https://<server address>:8443 (the certificate is self-signed: your browser asks you
# to accept it once) and follow the setup. This file is all you need: no other file, no folder to
# create, nothing to configure for a first try. Everything lives next to this file:
#
#   ./data/postgres  database          ./data/valkey   job queues
#   ./data/fichiers  documents, photos ./data/secrets  generated passwords and encryption key
#   ./data/certs     HTTPS certificate ./backups       daily backups (see the backup service)
#
# What happens on the first start:
#   - postgres generates its own password in ./data/secrets (nothing secret lives in this file);
#   - api generates the other secrets, creates the two restricted database roles (dfa_migrator for
#     schema changes, dfa_app for the application, which is subject to row level security) and
#     applies the database migrations before it starts; worker waits for it;
#   - web generates a self-signed HTTPS certificate in ./data/certs (put your own cert.pem and
#     key.pem there to use it instead).
# Upgrading is `docker compose pull && docker compose up -d`: the new api migrates the database
# before it starts.
#
# Optional settings: .env.example lists the few you may want (public address, email, backup hour).
# Optional profile:  --profile ocr   registration-document scanner (extra image, not required).
#
# Developers: docker/compose.dev.yml is the development stack, docker/compose.build.yml builds
# the images from source instead of pulling them.

name: dmsforall

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '5'

# Containers that start as root only to hand their bind-mounted folders to an unprivileged user,
# then switch to it (their entrypoint): the few capabilities this needs, nothing else.
x-drop-privileges: &drop-privileges
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETUID
    - SETGID

# Any other API setting (see docs/reference/configuration.md) can be added to .env under its own
# name: the API services read that file too, when it exists.
x-api-env-file: &api-env-file
  - path: .env
    required: false

# The database URLs, the encryption key, the cookie and proxy settings are set by the image
# entrypoint (see docker/entrypoint-api.sh) from the generated secrets and DFA_PUBLIC_URL.
x-api-env: &api-env
  NODE_ENV: production
  REDIS_URL: redis://valkey:6379
  DFA_PUBLIC_URL: ${DFA_PUBLIC_URL:-}
  DFA_PORT: ${DFA_PORT:-8443}
  OPENAPI_EXPOSER_DOCS: ${DFA_EXPOSE_API_DOCS:-false}
  SMTP_HOTE: ${DFA_SMTP_HOST:-}
  SMTP_PORT: ${DFA_SMTP_PORT:-587}
  SMTP_SECURISE: ${DFA_SMTP_SECURE:-false}
  SMTP_UTILISATEUR: ${DFA_SMTP_USER:-}
  SMTP_MOT_DE_PASSE: ${DFA_SMTP_PASSWORD:-}
  SMTP_EXPEDITEUR: ${DFA_SMTP_FROM:-}

x-api-volumes: &api-volumes
  - ./data/secrets:/secrets
  - ./data/fichiers:/repo/apps/api/uploads

services:
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    restart: unless-stopped
    # Generates its own superuser password once (./data/secrets/postgres_password, readable by the
    # api and backup users only) and then starts the standard entrypoint. Password authentication
    # stays on: the database is reachable from this compose network only (no published port), and
    # the generated password protects it even from another container added to that network.
    # The application never connects with this superuser: it would bypass row level security.
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        mkdir -p /secrets
        if [ ! -s /secrets/postgres_password ]; then
          if [ -s /var/lib/postgresql/data/PG_VERSION ]; then
            echo "dmsforall: ./data/postgres already holds a database but ./data/secrets has no postgres_password." >&2
            echo "dmsforall: restore the matching ./data/secrets folder, or stop the stack (docker compose down) and delete ./data/postgres to start from scratch." >&2
            exit 1
          fi
          tr -dc 'A-Za-z0-9' </dev/urandom | head -c 40 > /secrets/postgres_password.tmp
          mv /secrets/postgres_password.tmp /secrets/postgres_password
        fi
        chown 100:101 /secrets /secrets/postgres_password
        chmod 0400 /secrets/postgres_password
        POSTGRES_PASSWORD="$$(cat /secrets/postgres_password)"
        export POSTGRES_PASSWORD
        exec docker-entrypoint.sh "$$@"
      - sh
    command: ['postgres']
    environment:
      POSTGRES_USER: dfa
      POSTGRES_DB: dfa
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C.UTF-8'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./data/secrets:/secrets
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dfa -d dfa']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    # Not published on the host. To open a SQL shell:
    #   docker compose exec postgres psql -U dfa -d dfa
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  # Valkey (open source, Redis compatible) holds the background job queues.
  valkey:
    image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    restart: unless-stopped
    # Append-only file: the queues must survive a restart.
    command: ['valkey-server', '--appendonly', 'yes']
    volumes:
      - ./data/valkey:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    # Not published on the host, reachable from the compose network only.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  # Applies the database migrations (one process at a time, database lock) before it starts.
  api:
    image: ghcr.io/selfhostr/dmsforall:${DFA_VERSION:-latest}
    restart: unless-stopped
    env_file: *api-env-file
    environment:
      <<: *api-env
      PORT: '3000'
      MODE_PROCESSUS: api
      DFA_MIGRER_AU_DEMARRAGE: 'true'
    volumes: *api-volumes
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/sante').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 5
    stop_grace_period: 30s
    <<: [*hardening, *drop-privileges]

  # Same image as the API, runs the BullMQ queues and the scheduled jobs. Starts once the API is
  # healthy, that is once the database is migrated.
  worker:
    image: ghcr.io/selfhostr/dmsforall:${DFA_VERSION:-latest}
    restart: unless-stopped
    command: ['node', 'dist/main-worker.js']
    env_file: *api-env-file
    environment:
      <<: *api-env
      PORT: '3001'
      MODE_PROCESSUS: worker
    volumes: *api-volumes
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/sante').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    <<: [*hardening, *drop-privileges]

  # The only published port, HTTPS only. Serves the web app and relays /api to the api service.
  # The certificate is self-signed unless you put your own in ./data/certs. For a real domain name,
  # put your own reverse proxy in front (see the README) and set DFA_PUBLIC_URL.
  web:
    image: ghcr.io/selfhostr/dmsforall-web:${DFA_VERSION:-latest}
    restart: unless-stopped
    ports:
      - '${DFA_PORT:-8443}:8443'
    environment:
      DFA_PUBLIC_URL: ${DFA_PUBLIC_URL:-}
    volumes:
      - ./data/certs:/certs
    depends_on:
      api:
        condition: service_healthy
    <<: [*hardening, *drop-privileges]

  # Daily dump of the database and copy of the uploaded files into ./backups, kept 14 days.
  # Run one now:   docker compose exec -u dfa backup /scripts/sauvegarder.sh
  # Restore:       see docs/get-started/backup-and-restore.md
  backup:
    image: ghcr.io/selfhostr/dmsforall-backup:${DFA_VERSION:-latest}
    restart: unless-stopped
    environment:
      TZ: ${DFA_TIMEZONE:-Europe/Zurich}
      PGHOST: postgres
      PGUSER: dfa
      PGDATABASE: dfa
      HEURE_SAUVEGARDE: ${DFA_BACKUP_TIME:-02:30}
      RETENTION_JOURS: ${DFA_BACKUP_KEEP_DAYS:-14}
      AGE_CLE_PUBLIQUE: ${DFA_BACKUP_AGE_PUBLIC_KEY:-}
    volumes:
      - ./data/secrets:/secrets:ro
      - ./data/fichiers:/fichiers:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f planifier.sh >/dev/null']
      interval: 60s
      timeout: 5s
      start_period: 10s
      retries: 3
    <<: [*hardening, *drop-privileges]

  # --- profile ocr: registration-document scanner. The API calls it at http://ocr-permis:8092.
  # Without it the application works the same, only the "scan the registration document" shortcut
  # is unavailable.
  ocr-permis:
    image: ghcr.io/selfhostr/dmsforall-ocr:${DFA_VERSION:-latest}
    profiles: ['ocr']
    restart: unless-stopped
    <<: *hardening
