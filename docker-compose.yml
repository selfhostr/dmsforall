# Dev hybride DFA : seuls Postgres et Redis tournent en conteneurs.
# Le backend (apps/api) et le front (apps/web) tournent en Node local pour le hot-reload
# (`pnpm dev`), et se connectent à ces services via les ports publiés sur l'hôte.
#
# En production, tout (y compris l'app) tourne en conteneurs — voir docs/deploiement-local.md
# pour le détail dev, et la doc de déploiement prod (à venir) pour la config serveur.
#
# Les tests d'intégration N'UTILISENT PAS ces conteneurs : ils passent par testcontainers,
# qui démarre ses propres instances Postgres/Redis éphémères et isolées. La base `dfa_dev`
# ci-dessous est réservée au développement manuel — ne jamais la pointer depuis les tests.
#
# Rôles Postgres (RLS) : le service postgres démarre en superuser (`dfa`) UNIQUEMENT pour
# initialiser le conteneur. Au premier démarrage sur un volume vide, il exécute
# docker/postgres/init/01-roles.sql, qui crée les deux rôles réellement utilisés ensuite
# (dfa_migrator pour les migrations, dfa_app pour l'API — voir .env.example et le fichier SQL
# pour le détail). L'application ne se connecte JAMAIS avec le rôle superuser.
#
# L'attribut `version:` est déprécié depuis Compose v2 et volontairement omis.

services:
  postgres:
    # Alpine : image minimale, patchs de sécurité rapides. Version majeure fixée (16) pour
    # rester alignée avec la prod ; le tag mineur suit les correctifs de sécurité en amont.
    image: postgres:16-alpine
    container_name: dfa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dfa
      POSTGRES_PASSWORD: dfa_dev_local
      POSTGRES_DB: dfa_dev
      # Encodage/locale explicites : montants, dates et tri doivent être stables et
      # reproductibles entre le poste de dev (Windows) et les serveurs de prod (Linux).
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C.UTF-8'
    ports:
      # Publié sur l'hôte car l'app (Node local) et les outils (psql, Drizzle Studio, GUI)
      # s'y connectent directement depuis l'extérieur du réseau Docker.
      - '5432:5432'
    volumes:
      - dfa_postgres_data:/var/lib/postgresql/data
      # Monté en lecture seule : ne s'exécute qu'à l'initdb d'un volume vide (comportement
      # standard de /docker-entrypoint-initdb.d/). Sur un volume déjà initialisé, il faut
      # `docker compose down -v` pour qu'il rejoue — voir docs/deploiement-local.md.
      - ./docker/postgres/init/01-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dfa -d dfa_dev']
      interval: 5s
      timeout: 5s
      retries: 10
      # Laisse le temps à un premier démarrage (initdb) sur un poste lent avant de compter
      # les échecs de healthcheck.
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: dfa-redis
    restart: unless-stopped
    # Persistance AOF (Append Only File) : Redis sert de backend BullMQ (files de jobs) en
    # plus du cache, on ne veut pas perdre les jobs en attente à un redémarrage du conteneur.
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - dfa_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  ocr-permis:
    # Service OCR dédié à la lecture du permis de circulation (RapidOCR, voir
    # apps/api/src/vehicules/ocr/moteur-rapidocr-conteneur/). Construit localement (pas d'image
    # publiée) — même doctrine que les autres conteneurs internes de ce dépôt.
    build:
      context: ./apps/api/src/vehicules/ocr/moteur-rapidocr-conteneur
    container_name: dfa-ocr-permis
    restart: unless-stopped
    ports:
      # 8092, HORS de la plage éphémère du noyau (32768-60999) : Docker rootless (ce poste) ne
      # publie PAS un port choisi dans cette plage — piège vérifié, voir docs/deploiement-local.md.
      # Publié sur l'hôte car l'API (Node local, `pnpm dev`) l'appelle directement, comme
      # postgres/redis ci-dessus — voir OCR_SERVICE_URL (apps/api/src/vehicules/ocr/config-ocr.ts,
      # `.env`).
      - '8092:8092'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8092/sante', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      # Chargement de deux instances RapidOCR au démarrage (profils "page"/"zone", voir moteur.py)
      # — quelques secondes, pas instantané.
      start_period: 20s

volumes:
  # Volumes nommés : les données survivent aux `docker compose down` (sans -v) et aux
  # recréations de conteneurs. `docker compose down -v` reste le moyen de repartir de zéro.
  dfa_postgres_data:
  dfa_redis_data:
