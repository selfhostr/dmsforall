# Development stack.
#
# Default (hybrid): PostgreSQL, Valkey and the registration-document scanner run in containers,
# the API and the web app run with Node on the host for hot reload (`pnpm dev`):
#
#   pnpm docker:up && pnpm db:migrate && pnpm db:seed && pnpm dev
#
# Fully containerised, for a machine without Node and pnpm:
#
#   docker compose -f docker/compose.dev.yml --profile containers run --rm api pnpm install
#   docker compose -f docker/compose.dev.yml --profile containers up
#
# Integration tests do not use these containers: testcontainers starts its own throwaway
# PostgreSQL and Valkey. The dfa_dev database is for manual work only.
#
# The postgres service starts as superuser (dfa) only to initialise the container. On the first
# start with an empty volume it runs docker/postgres/init/01-roles.sql, which creates the two
# roles the application really uses (dfa_migrator for migrations, dfa_app for the API). After
# editing that file, `docker compose -f docker/compose.dev.yml down -v` is needed to replay it.
#
# The stack users install is docker-compose.yml at the repository root (bind mounts under ./data,
# no named volumes, no file next to it). Paths below are relative to this directory (docker/).

name: dmsforall-dev

services:
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    container_name: dfa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dfa
      POSTGRES_PASSWORD: dfa_dev_local
      POSTGRES_DB: dfa_dev
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C.UTF-8'
    ports:
      - '5432:5432'
    volumes:
      - dfa_postgres_data:/var/lib/postgresql/data
      - ./postgres/init/01-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dfa -d dfa_dev']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  valkey:
    image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    container_name: dfa-redis
    restart: unless-stopped
    command: valkey-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - dfa_valkey_data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  ocr-permis:
    build:
      context: ../apps/api/src/vehicules/ocr/moteur-rapidocr-conteneur
    container_name: dfa-ocr-permis
    restart: unless-stopped
    ports:
      # 8092 is outside the kernel ephemeral range (32768-60999): rootless Docker does not serve
      # published ports inside it.
      - '8092:8092'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8092/sante', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # --- profile containers: API and web app in containers, source bind-mounted. -------------

  api: &node-dev
    profiles: ['containers']
    image: node:26-alpine@sha256:8996bb5821d62a8fd9bb27c1cb07462f3fdce6e47d640c6a881ead0b064ce216
    container_name: dfa-api-dev
    working_dir: /workspace
    # Everything from the root .env, then the three values that must differ inside the compose
    # network (the .env file holds localhost values for Node running on the host).
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://dfa_app:dfa_app_dev@postgres:5432/dfa_dev
      DATABASE_URL_MIGRATION: postgresql://dfa_migrator:dfa_migrator_dev@postgres:5432/dfa_dev
      REDIS_URL: redis://valkey:6379
      OCR_SERVICE_URL: http://ocr-permis:8092
      DFA_DEV_PROXY_API_CIBLE: http://api:3000
    volumes:
      - ..:/workspace
      # Named volumes shadow the host node_modules directories (different OS and libc).
      - dfa_dev_node_modules_racine:/workspace/node_modules
      - dfa_dev_node_modules_api:/workspace/apps/api/node_modules
      - dfa_dev_node_modules_web:/workspace/apps/web/node_modules
      - dfa_dev_node_modules_shared:/workspace/packages/shared/node_modules
      - dfa_dev_pnpm_store:/root/.local/share/pnpm/store
      - dfa_dev_corepack_cache:/root/.cache/node/corepack
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    command: ['sh', '-c', 'corepack enable && pnpm --filter @dfa/api dev']
    ports:
      - '3000:3000'

  web:
    <<: *node-dev
    container_name: dfa-web-dev
    command: ['sh', '-c', 'corepack enable && pnpm --filter @dfa/web dev -- --host']
    ports:
      - '5173:5173'

volumes:
  dfa_postgres_data:
  dfa_valkey_data:
  dfa_dev_node_modules_racine:
  dfa_dev_node_modules_api:
  dfa_dev_node_modules_web:
  dfa_dev_node_modules_shared:
  dfa_dev_pnpm_store:
  dfa_dev_corepack_cache:
