# En-têtes de sécurité du front (inclus dans chaque location qui sert des fichiers, car un
# add_header placé dans une location annule ceux du niveau supérieur). Pas pour /api : l'API pose
# les siens. HSTS volontairement absent : le certificat par défaut est auto-signé, et c'est au
# reverse proxy public (s'il y en a un) d'annoncer HSTS pour le vrai nom de domaine.
# CSP : bundle same-origin, appels API same-origin, aucune ressource tierce. `style-src
# 'unsafe-inline'` reste nécessaire (attributs style de React/shadcn) ; script-src reste strict.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
