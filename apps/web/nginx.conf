# Configuration nginx du conteneur front (SPA React/Vite servie en statique).
#
# Fichier de configuration nginx COMPLET (remplace /etc/nginx/nginx.conf de l'image de base,
# pas un fragment inclus dans conf.d/) : plus simple à auditer d'un bloc pour un seul service
# statique, pas de risque de collision avec le default.conf de l'image officielle.
#
# Ce conteneur ne fait QUE du statique + fallback SPA. Il ne reverse-proxie PAS /api : en
# production, c'est le service `proxy` (docker-compose.yml) qui route /api/* vers
# le conteneur API et tout le reste vers ce conteneur — les deux sont deux origines distinctes
# derrière un seul reverse proxy public (voir docs/get-started/installation.md). C'est pourquoi
# ce fichier n'a aucune directive `proxy_pass` vers l'API.

# Pas de `user` : ce conteneur tourne déjà en non-root de bout en bout (voir Dockerfile, USER
# nginx) — root et worker processes tournent sous la même identité, aucun changement de
# privilège à faire ici (et nginx émettrait un avertissement inoffensif s'il essayait).
worker_processes auto;

# PID en /tmp : /var/run n'est pas garanti inscriptible par un utilisateur non-root sur toutes
# les images de base, /tmp l'est toujours (sticky bit 1777).
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Logs vers stdout/stderr (convention Docker) plutôt que des fichiers dans le conteneur —
  # cohérent avec la journalisation structurée du reste de la stack (voir docker-compose.yml,
  # driver json-file). Format compact, suffisant pour un service purement statique : le détail
  # applicatif (erreurs JS, requêtes API) vit dans Sentry et les logs de l'API, pas ici.
  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout 65;

  # Tailles de requêtes/en-têtes par défaut suffisantes pour un service qui ne reçoit que des
  # GET de fichiers statiques — pas d'upload, pas de gros payloads ici.
  client_max_body_size 1m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml+rss
    image/svg+xml;

  # En-têtes de sécurité — s'appliquent à TOUTES les réponses de ce serveur (SPA + assets).
  # HSTS est volontairement absent ici : posé une seule fois côté reverse proxy (Caddy, qui
  # termine TLS pour l'ensemble de la stack), pas dupliqué à cette couche qui ne voit que du
  # HTTP en interne et ne peut garantir que la connexion cliente est effectivement en HTTPS.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # CSP resserrée à ce que la SPA utilise réellement : bundle JS/CSS same-origin, appels API
  # same-origin (le reverse proxy expose API et front sur le même domaine public — voir
  # WEB_URL_PUBLIQUE/API_URL_PUBLIQUE), aucune ressource tierce. `style-src 'unsafe-inline'`
  # reste nécessaire : React applique certains styles via l'attribut `style=""` (ex. composants
  # shadcn/ui), que CSP régit même sans balise <style> explicite ; script-src reste strict (pas
  # d'eval, pas d'inline) car le build Vite de production n'en a pas besoin. À resserrer encore
  # (nonce) si une fonctionnalité future l'exige — coordination UI/frontend, pas un
  # changement à faire à la légère ici.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  server {
    # Port non privilégié : permet au processus nginx de tourner intégralement en non-root
    # (bind sur un port <1024 exigerait CAP_NET_BIND_SERVICE). Le port public 443/80 est celui
    # du reverse proxy, jamais celui-ci — voir docker-compose.yml.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sonde de vie du conteneur (HEALTHCHECK Dockerfile + reverse proxy) : ne dépend d'aucun
    # fichier applicatif, répond tant que nginx tourne.
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Assets Vite : noms de fichiers hashés par contenu (ex. index-a1b2c3d4.js) — cache long et
    # immuable sûr, un nouveau déploiement produit systématiquement de nouveaux noms de fichiers.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # `index.html` ne doit JAMAIS être mis en cache de façon persistante : c'est le seul fichier
    # dont le NOM ne change pas d'un déploiement à l'autre, donc le seul point par lequel les
    # clients découvrent les nouveaux noms de bundles hashés. Le mettre en cache figerait les
    # utilisateurs sur une ancienne version tant que le cache ne périme pas — jusqu'à des bundles
    # JS/CSS 404 après un déploiement (les anciens fichiers ont été remplacés).
    location = /index.html {
      add_header Cache-Control "no-cache" always;
    }

    # Fallback SPA : toute route qui ne correspond à aucun fichier statique retombe sur
    # index.html, laissant React Router (apps/web/src/routes) décider — indispensable pour que
    # les URLs profondes (ex. /clients/123) fonctionnent au rechargement complet de page.
    # Pas de `error_page 404` global ici, volontairement : il intercepterait aussi le `=404`
    # de `location /assets/` ci-dessus et servirait index.html à la place d'un vrai 404 pour un
    # asset manquant — masquant un bundle cassé (déploiement incomplet, cache proxy périmé)
    # derrière une page qui a l'air de fonctionner. Seule `location /` retombe sur index.html,
    # via `try_files`, ce qui suffit à couvrir les routes React Router (ex. /clients/123 au
    # rechargement complet) sans avaler les erreurs sur les fichiers statiques.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
