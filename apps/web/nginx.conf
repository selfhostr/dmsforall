# Configuration nginx du conteneur web : SPA React/Vite en statique, relais de /api vers le
# conteneur api, et TLS.
#
# Fichier de configuration nginx COMPLET (remplace /etc/nginx/nginx.conf de l'image de base).
#
# Ce conteneur est le seul point d'entrée de l'installation : il écoute en HTTPS uniquement
# (port 8443, certificat dans /certs, auto-signé au premier démarrage par l'entrypoint, ou celui
# que l'utilisateur y dépose). Il sert le front et relaie /api/* vers http://api:3000. Un reverse
# proxy public placé devant (Caddy, nginx, Traefik...) lui parle en HTTPS et doit accepter ce
# certificat auto-signé (voir docs/get-started/installation.md).
#
# Le processus maître reste root avec le strict minimum de capacités (voir docker-compose.yml :
# cap_drop ALL) : il doit pouvoir ouvrir /dev/stdout et lire la clé TLS, qu'un utilisateur
# non-root ne peut pas faire derrière le tube de journalisation de Docker. Les workers, seuls à
# traiter des requêtes, tournent sous l'utilisateur nginx.
user nginx;
worker_processes auto;

# PID en /tmp : /var/run n'est pas garanti inscriptible par un utilisateur non-root.
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Logs vers stdout/stderr (convention Docker).
  access_log /dev/stdout;
  error_log  /dev/stderr warn;

  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout 65;
  server_tokens off;

  client_max_body_size 1m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml+rss
    image/svg+xml;

  # Résolution DNS de Docker : l'adresse du conteneur api est relue (et non figée au démarrage de
  # nginx), donc `docker compose up -d` qui recrée l'api ne casse pas le relais.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Sonde de vie du conteneur (HEALTHCHECK Dockerfile). Loopback seulement, jamais publiée.
  server {
    listen 127.0.0.1:8081;
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }
  }

  server {
    # Port non privilégié (>1024) : nginx tourne en non-root. HTTPS seulement, aucun port HTTP.
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 1h;

    root /usr/share/nginx/html;
    index index.html;

    # API : relayée telle quelle (l'API pose ses propres en-têtes de sécurité). Host et
    # X-Forwarded-* permettent à l'API de connaître l'adresse réelle du navigateur
    # (TRUST_PROXY_HOPS, cookies, contrôle d'Origin).
    location /api/ {
      set $amont http://api:3000;
      proxy_pass $amont;
      proxy_http_version 1.1;
      proxy_set_header Host              $http_host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection        "";
      # Uploads (photos, archives de reprise) : la limite réelle est celle de l'API.
      client_max_body_size 1g;
      proxy_request_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      # Flux temps réel (SSE) : pas de mise en tampon.
      proxy_buffering off;
    }

    # Assets Vite : noms hashés par contenu, cache long et immuable.
    location /assets/ {
      include /etc/nginx/securite.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # `index.html` jamais en cache persistant : seul fichier dont le nom ne change pas d'un
    # déploiement à l'autre, point d'entrée vers les bundles hashés.
    location = /index.html {
      include /etc/nginx/securite.conf;
      add_header Cache-Control "no-cache" always;
    }

    # Fallback SPA : toute route sans fichier statique retombe sur index.html (React Router).
    # Pas de `error_page 404` global : un asset manquant doit rester un vrai 404.
    location / {
      include /etc/nginx/securite.conf;
      try_files $uri $uri/ /index.html;
    }
  }
}
