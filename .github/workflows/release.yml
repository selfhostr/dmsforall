name: Release

# Images (ghcr.io/selfhostr/dmsforall, dmsforall-web, dmsforall-ocr,
# dmsforall-backup):
#   - every push to dev   -> :edge
#   - every tag vX.Y.Z    -> :X.Y.Z, :X.Y and :latest (a pre-release tag such as v0.2.0-rc.1
#                            only gets its own tag)
# Each image carries an SBOM (SPDX), a SLSA build provenance attestation and a keyless Sigstore
# signature. A tag also creates the GitHub release, with notes from CHANGELOG.md and the
# compose file as a signed asset.
#
#   gh attestation verify oci://ghcr.io/selfhostr/dmsforall:<tag> -R selfhostr/dmsforall
#   cosign verify ghcr.io/selfhostr/dmsforall:<tag> \
#     --certificate-identity-regexp 'https://github.com/selfhostr/dmsforall/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com

on:
  push:
    branches: [dev]
    tags: ['v*']

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

# A newer push to dev replaces the :edge build in progress. A tag is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' }}

jobs:
  version:
    name: Check the tag against the version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The API reports the version of package.json. A tag that does not match it would publish
      # images that announce another version.
      - id: version
        run: |
          set -eu
          package=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "tag $tag, package.json $package"
            # A pre-release tag (0.2.0-rc.1) is checked against its base version.
            test "${tag%%-*}" = "${package%%-*}" || { echo "::error::tag $GITHUB_REF_NAME but package.json says $package"; exit 1; }
            echo "version=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "version=$package-edge.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Checks
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  images:
    name: Image ${{ matrix.name }}
    needs: [version, checks]
    # `checks` is skipped on dev: the push already ran CI.
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.checks.result == 'success' || needs.checks.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      # Push to ghcr.io.
      packages: write
      # Build provenance and keyless signature (Sigstore, OIDC).
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: ghcr.io/selfhostr/dmsforall
            context: .
            dockerfile: apps/api/Dockerfile
            title: dmsforall API
          - name: web
            image: ghcr.io/selfhostr/dmsforall-web
            context: .
            dockerfile: apps/web/Dockerfile
            title: dmsforall web app
          - name: ocr
            image: ghcr.io/selfhostr/dmsforall-ocr
            context: apps/api/src/vehicules/ocr/moteur-rapidocr-conteneur
            dockerfile: apps/api/src/vehicules/ocr/moteur-rapidocr-conteneur/Dockerfile
            title: dmsforall registration document scanner
          - name: backup
            image: ghcr.io/selfhostr/dmsforall-backup
            context: docker/postgres/sauvegarde
            dockerfile: docker/postgres/sauvegarde/Dockerfile
            title: dmsforall encrypted backups
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every timestamp in the image is the commit date, not the build date.
      - name: Commit date
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=edge,branch=dev
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # latest follows stable tags only, never dev and never a pre-release.
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=Dealer management system for Swiss garages
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.created={{commit_date 'YYYY-MM-DDTHH:mm:ss[Z]'}}
          annotations: |
            org.opencontainers.image.created={{commit_date 'YYYY-MM-DDTHH:mm:ss[Z]'}}

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          # push=true as an output, so that file dates can be rewritten to SOURCE_DATE_EPOCH.
          outputs: type=image,push=true,rewrite-timestamp=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION_APP=${{ needs.version.outputs.version }}
            VERSION_APP_BRANCHE=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: ${{ github.ref == 'refs/heads/dev' && format('type=gha,scope={0},mode=max,ignore-error=true', matrix.name) || '' }}
          # SBOM (SPDX) and full SLSA provenance attached to the image index by BuildKit.
          sbom: true
          provenance: mode=max

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the image (keyless)
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  github-release:
    name: Publish the GitHub release
    if: github.ref_type == 'tag'
    needs: [version, images]
    runs-on: ubuntu-latest
    permissions:
      # Create the release and attach the files.
      contents: write
      # Keyless signature of the release assets.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Notes are the CHANGELOG.md section of this version ("## X.Y.Z ..."). A pre-release tag
      # falls back to the section of its base version. No section: the job fails.
      - name: Release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          for wanted in "$VERSION" "${VERSION%%-*}"; do
            awk -v v="$wanted" '
              /^## / { if (found) exit; if ($2 == v || $2 == "[" v "]") { found = 1; next } }
              found { print }
            ' CHANGELOG.md > notes.md
            if [ -s notes.md ]; then break; fi
          done
          test -s notes.md || { echo "::error::no section for $VERSION in CHANGELOG.md"; exit 1; }
          cat notes.md

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # The compose file and the settings template are what an operator downloads.
      - name: Checksums and signatures
        run: |
          set -eu
          mkdir assets
          cp docker-compose.yml .env.example assets/
          cd assets
          for file in docker-compose.yml .env.example; do
            sha256sum "$file" > "$file.sha256"
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
          ls -l

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag $flags
