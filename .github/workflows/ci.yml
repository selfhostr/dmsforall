name: CI

# Format, lint, types, unit tests, i18n, build, integration tests on a throwaway database,
# migration reversibility, licences, advisories and the Docker install. Job names are part of
# the required status checks of the dev and main rulesets: do not rename them.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The web build reads VITE_API_URL from the root .env.
      - name: Prepare .env
        run: cp .env.example .env

      - name: Build @dfa/shared
        run: pnpm --filter @dfa/shared build

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: i18n keys
        run: pnpm --filter @dfa/web i18n:check

      - name: Unit tests
        run: pnpm -r --sequential run test

      - name: Build
        run: pnpm build

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build @dfa/shared
        run: pnpm --filter @dfa/shared build

      # Tests read Microsoft Access archives with the mdb-* command line tools.
      - name: Install mdbtools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mdbtools

      # testcontainers starts its own PostgreSQL and Valkey, the settings below only satisfy the
      # configuration schema.
      - name: Integration tests
        run: pnpm test:integration
        env:
          NODE_ENV: test
          PORT: '3000'
          API_URL_PUBLIQUE: http://localhost:3000
          WEB_URL_PUBLIQUE: http://localhost:5173
          DATABASE_URL: postgresql://dfa_app:dfa_app_dev@localhost:5432/dfa_test
          DATABASE_URL_MIGRATION: postgresql://dfa_migrator:dfa_migrator_dev@localhost:5432/dfa_test
          DATABASE_POOL_MAX: '10'
          DATABASE_TIMEOUT_REQUETE_MS: '10000'
          REDIS_URL: redis://localhost:6379
          SESSION_COOKIE_NOM: dfa_session
          SESSION_DUREE_MINUTES: '480'
          SESSION_INACTIVITE_MINUTES: '120'
          COOKIE_SECURE: 'false'
          ARGON2_MEMOIRE_KIB: '19456'
          ARGON2_ITERATIONS: '2'
          ARGON2_PARALLELISME: '1'
          LIMITE_CONNEXION_IP: '20'
          LIMITE_CONNEXION_COMPTE: '5'
          SEUIL_VERROUILLAGE_COMPTE: '3'
          LIMITE_FENETRE_SECONDES: '900'
          LOG_NIVEAU: debug
          OPENAPI_EXPOSER_DOCS: 'true'
          VERSION_APP: 0.0.0-ci

  migrations-reversibility:
    name: Migrations reversibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Each migration is applied, rolled back with its down script and applied again; the
      # schema dumps must match at every step.
      - name: Check every migration (up, down, up)
        run: scripts/verifier-reversibilite-migrations.sh

  licences-and-advisories:
    name: Licences and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Only OSI-approved licences pass, see the list in the script.
      - name: Licences
        run: pnpm licenses list --json | node .github/scripts/check-licenses.mjs

      - name: Advisories (production dependencies, high and critical)
        run: pnpm audit --prod --audit-level high

  docker:
    name: Docker install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.build.yml
      DFA_VERSION: ci
      DFA_HTTP_PORT: '8080'
      DFA_EXPOSE_API_DOCS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The images are built but never pushed on pull requests. Then the real compose file starts
      # the whole product from them.
      - name: Build the images
        run: docker compose build api web

      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 300

      - name: Health and API documentation
        run: |
          set -eu
          curl --fail --silent --show-error http://localhost:8080/api/v1/sante
          echo
          curl --fail --silent --show-error http://localhost:8080/api/docs.json | head -c 200
          echo
          curl --fail --silent --show-error --output /dev/null http://localhost:8080/

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100

      - name: Stop the stack
        if: always()
        run: docker compose down -v
