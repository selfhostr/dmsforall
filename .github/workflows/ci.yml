name: CI

# Push sur main (post-merge) et toute PR ciblant main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annule les runs obsolètes d'une même branche/PR quand de nouveaux commits arrivent :
# évite de consommer des minutes CI sur du code déjà dépassé.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissions minimales : ce workflow ne fait que lire le code et exécuter des vérifications,
# il ne publie ni ne modifie rien dans le dépôt ou sur GitHub.
permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # Lint, typecheck, tests unitaires et build — le socle de vérification rapide sur
  # chaque push/PR. Les workspaces (apps/api, apps/web) sont attendus, mais les scripts
  # racine (package.json) agrègent via `pnpm -r`, qui saute silencieusement un workspace
  # n'ayant pas encore le script correspondant : le job reste valide même en cours de
  # construction du monorepo.
  verifier:
    name: Vérifier (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Pas de `version:` ici : pnpm/action-setup@v4 la lit dans `packageManager` de
      # package.json, seule source de vérité. La spécifier aussi ici ferait échouer
      # l'action (conflit de version détecté entre les deux sources).
      - name: Installer pnpm
        uses: pnpm/action-setup@v4

      - name: Installer Node ${{ env.NODE_VERSION }} (avec cache du store pnpm)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Installer les dépendances (lockfile figé)
        run: pnpm install --frozen-lockfile

      # apps/web/vite.config.ts fixe `envDir` sur la racine du monorepo et refuse de builder si
      # VITE_API_URL n'en est pas résolue (garde-fou volontaire, voir CONTRIBUTING.md). `.env` est
      # gitignoré et donc absent sur un checkout CI ; `.env.example` définit déjà
      # VITE_API_URL=/api/v1, suffisant pour un build (aucun secret réel n'est nécessaire ici).
      - name: Préparer le .env racine (VITE_API_URL pour le build web)
        run: cp .env.example .env

      # @dfa/shared est compilé en CommonJS pour NestJS (voir packages/shared/package.json :
      # `exports` ne pointe que vers ./dist, aucun fallback vers les sources). apps/api résout
      # donc @dfa/shared via son dist/ compilé, pas via `tsc --noEmit` (le script `typecheck` de
      # shared, qui ne produit aucun dist/). Sans cette étape, `pnpm typecheck` ci-dessous échoue
      # en cascade sur apps/api avec TS2307 (« Cannot find module '@dfa/shared' »). Même besoin
      # déjà couvert dans les deux jobs suivants (« Tests d'intégration » et réversibilité des
      # migrations) — ce job est le seul à l'avoir oublié.
      - name: Construire @dfa/shared
        run: pnpm --filter @dfa/shared build

      - name: Formatage (Prettier)
        run: pnpm format:check

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Vérification des types (TypeScript)
        run: pnpm typecheck

      - name: Tests unitaires
        run: pnpm test

      - name: Build
        run: pnpm build

  # Tests d'intégration : utilisent testcontainers (Postgres + Redis éphémères démarrés par
  # les tests eux-mêmes), donc AUCUN `services:` déclaré ici — ce serait redondant et
  # risquerait d'entrer en conflit sur les ports avec les conteneurs de testcontainers.
  # ubuntu-latest fournit Docker nativement, requis par testcontainers.
  tests-integration:
    name: Tests d'intégration (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Pas de `version:` ici : pnpm/action-setup@v4 la lit dans `packageManager` de
      # package.json, seule source de vérité. La spécifier aussi ici ferait échouer
      # l'action (conflit de version détecté entre les deux sources).
      - name: Installer pnpm
        uses: pnpm/action-setup@v4

      - name: Installer Node ${{ env.NODE_VERSION }} (avec cache du store pnpm)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Installer les dépendances (lockfile figé)
        run: pnpm install --frozen-lockfile

      # @dfa/shared est compilé en CommonJS pour NestJS (voir packages/shared/package.json :
      # `exports` ne pointe que vers ./dist, aucun fallback vers les sources). Le job « Vérifier »
      # construit shared en passant par `pnpm build` (= `pnpm -r build`), mais ce job repart d'un
      # checkout propre et n'appelle jamais ce script — sans cette étape, vitest échoue à résoudre
      # l'entrée du package (« Failed to resolve entry for package "@dfa/shared" »). Même besoin,
      # déjà couvert dans scripts/verifier-reversibilite-migrations.sh (voir son étape
      # "build-shared.log"), qui construit shared lui-même avant de jouer les migrations.
      - name: Construire @dfa/shared
        run: pnpm --filter @dfa/shared build

      - name: Tests d'intégration
        run: pnpm test:integration
        env:
          # Valeurs de test en dur, aucun secret réel. testcontainers démarre ses propres
          # conteneurs Postgres/Redis éphémères ; DATABASE_URL/DATABASE_URL_MIGRATION/REDIS_URL
          # ci-dessous ne servent qu'à satisfaire la validation zod au démarrage si le code lit
          # l'env avant de basculer sur les conteneurs éphémères — ils ne pointent vers aucun
          # service réel du CI. Les deux DATABASE_URL* utilisent des rôles différents
          # (dfa_app / dfa_migrator), comme l'exige la validation zod (RLS — voir
          # docker/postgres/init/01-roles.sql).
          NODE_ENV: test
          PORT: '3000'
          API_URL_PUBLIQUE: http://localhost:3000
          WEB_URL_PUBLIQUE: http://localhost:5173
          DATABASE_URL: postgresql://dfa_app:dfa_app_dev@localhost:5432/dfa_test
          DATABASE_URL_MIGRATION: postgresql://dfa_migrator:dfa_migrator_dev@localhost:5432/dfa_test
          DATABASE_POOL_MAX: '10'
          DATABASE_TIMEOUT_REQUETE_MS: '10000'
          REDIS_URL: redis://localhost:6379
          SESSION_COOKIE_NOM: dfa_session
          SESSION_DUREE_MINUTES: '480'
          SESSION_INACTIVITE_MINUTES: '120'
          COOKIE_SECURE: 'false'
          ARGON2_MEMOIRE_KIB: '19456'
          ARGON2_ITERATIONS: '2'
          ARGON2_PARALLELISME: '1'
          LIMITE_CONNEXION_IP: '20'
          LIMITE_CONNEXION_COMPTE: '5'
          # DOIT rester STRICTEMENT INFÉRIEUR à LIMITE_CONNEXION_COMPTE ci-dessus (contrainte
          # croisée du schéma zod, apps/api/src/config/charger-config.ts, superRefine) : sans
          # cette ligne, SEUIL_VERROUILLAGE_COMPTE retombe sur son défaut de 5, identique à
          # LIMITE_CONNEXION_COMPTE, et `chargerConfig` refuse de démarrer (ErreurConfigInvalide)
          # pour tout chemin qui l'invoquerait avec ces variables. Abaissé ici plutôt que relevé
          # LIMITE_CONNEXION_COMPTE (qui resterait à 15, le défaut de prod) : ce bloc sert de
          # filet si un chemin de code lit un jour process.env avant de basculer sur les
          # conteneurs éphémères (voir le commentaire de tête de ce bloc), pas à faire tourner de
          # test de brute-force lui-même — le garder bas maintient ce filet rapide à satisfaire.
          # Mêmes valeurs que apps/api/test/setup/app-test.ts::envTest() dans leur RELATION
          # (compte < limite), pas dans leur montant : ce fichier n'a pas besoin de coller aux
          # défauts de prod (15/5), seulement de rester valide. Rappel du pourquoi de la
          # contrainte elle-même (bloquant B1, rapport QA étape 0) : si le budget de débit par
          # email s'épuise au même rythme ou avant le seuil de verrouillage, la tentative qui doit
          # PROUVER le verrouillage (bon mot de passe, compte déjà verrouillé) se fait refuser par
          # le limiteur de débit et rend 429 au lieu du 423 attendu — le verrouillage devient
          # untestable.
          SEUIL_VERROUILLAGE_COMPTE: '3'
          LIMITE_FENETRE_SECONDES: '900'
          LOG_NIVEAU: debug
          OPENAPI_EXPOSER_DOCS: 'true'
          VERSION_APP: 0.1.0-ci

  # Réversibilité des migrations : la règle du dépôt (« migrations réversibles, expand/contract,
  # jamais destructives ») était vérifiée À LA MAIN jusqu'ici — appliquer la montante, dumper le
  # schéma, appliquer l'inverse, réappliquer la montante, comparer les dumps. Protocole qui a
  # réellement trouvé quelque chose (un `comment on table` que 0012 ne restaurait pas mot pour mot,
  # alors que `verifierPostureRls()` au démarrage de l'API lit CE commentaire). scripts/verifier-
  # reversibilite-migrations.sh l'automatise : CHAQUE migration existante est testée
  # INDIVIDUELLEMENT (pas un seul cycle « up all → down all → up all », qui désignerait mal le
  # coupable), dans l'ordre où elle a réellement été appliquée. Voir l'en-tête du script pour
  # l'arbitrage détaillé (granularité, périmètre historique complet plutôt que diff de branche) et
  # pour ce que ce garde-fou NE détecte PAS (aucune donnée réelle, aucun verrou de production,
  # aucun rollback de plusieurs migrations d'affilée).
  #
  # AUCUN `services:` Postgres ici : le script démarre et détruit lui-même son propre conteneur
  # Postgres jetable (jamais `dfa_dev`/`dfa_test`), et route tout `psql`/`pg_dump` via `docker exec`
  # dedans — donc AUCUN outil client Postgres n'est requis sur le runner, seuls `docker` (natif sur
  # ubuntu-latest) et `pnpm` le sont.
  verifier-reversibilite-migrations:
    name: Réversibilité des migrations (up → down → up, une par une)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Pas de `version:` ici : pnpm/action-setup@v4 la lit dans `packageManager` de
      # package.json, seule source de vérité. La spécifier aussi ici ferait échouer
      # l'action (conflit de version détecté entre les deux sources).
      - name: Installer pnpm
        uses: pnpm/action-setup@v4

      - name: Installer Node ${{ env.NODE_VERSION }} (avec cache du store pnpm)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Pas de `pnpm install` séparé : le script l'exécute lui-même, UNE seule fois pour toute la
      # vérification (jamais par migration) — voir son en-tête. Le cache pnpm ci-dessus (même clé
      # que les deux jobs précédents, basée sur pnpm-lock.yaml) s'applique de la même façon.
      - name: Vérifier la réversibilité de chaque migration
        run: scripts/verifier-reversibilite-migrations.sh
