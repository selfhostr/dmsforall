name: Publier les images

# Comble l'écart documenté dans docs/deploiement-production.md §3.1 : docker-compose.yml
# déploie par image taguée (API_IMAGE/WEB_IMAGE) et le rollback (§10) consiste à redéployer le
# tag précédent — ce workflow est ce qui produit ces images taguées, immuables et retrouvables.
#
# Déclencheurs, volontairement seulement ces deux-là (pas de pull_request : une PR n'a de toute
# façon pas accès en écriture à GITHUB_TOKEN sur un fork, et publier une image depuis du code non
# mergé n'a pas de sens ici) :
#   - push d'un tag vX.Y.Z (glob GitHub Actions, pas une regex : `[0-9]+` = un ou plusieurs
#     chiffres, `.` = littéral) → image de RELEASE, tag immuable = le tag Git lui-même. C'est le
#     tag que §5/§10 de docs/deploiement-production.md placent dans API_IMAGE/WEB_IMAGE.
#   - push sur main → image de PRÉ-PRODUCTION, tag immuable `main-<sha-court>` (jamais `latest`
#     ni `main` seul : un tag mouvant empêcherait de redéployer précisément la version d'avant,
#     exactement ce que le rollback documenté doit pouvoir faire à 2h du matin).
# Pas de tags pré-release (v1.2.3-rc1) : le projet n'en utilise pas à ce jour (voir les exemples
# de tags dans docs/deploiement-production.md, toujours vX.Y.Z nu) — à élargir le jour où le
# besoin apparaît réellement, pas avant.
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

# Un push de tag est un événement unique (on ne pousse pas deux fois le même tag) : annuler un
# run de publication de release en cours serait dangereux. Sur main, en revanche, des pushes
# rapprochés sont courants : annuler le run pré-production obsolète au profit du plus récent est
# le comportement voulu. `github.ref` distingue déjà les deux cas (refs/tags/vX.Y.Z vs
# refs/heads/main), donc un seul groupe suffit.
concurrency:
  group: publier-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permission par défaut du workflow : lecture seule. Chaque job qui a réellement besoin de plus
# (ici uniquement `construire-publier`, pour cloner avec l'historique complet) déclare son propre
# bloc `permissions:`, qui remplace celui-ci pour ce job — jamais l'inverse.
permissions:
  contents: read

env:
  NODE_VERSION: '22'
  # Pas de REGISTRY statique ici (c'était `ghcr.io` du temps de GitHub) : depuis la migration vers
  # forge auto-hébergé, l'hôte du registre de conteneurs est dérivé à l'exécution de
  # `github.server_url` (ROOT_URL de l'instance, ex. http://192.168.1.10:3300) par l'étape
  # "Hôte du registre de conteneurs" ci-dessous — jamais codé en dur ici, pour ne pas avoir à
  # retoucher ce fichier si l'instance change un jour d'adresse. Voir `steps.registre.outputs.hote`.

jobs:
  # --- Porte de qualité : les trois jobs de ci.yml, invoqués via `workflow_call` -------------
  # Anciennement une copie complète des trois jobs (verifier, tests-integration,
  # verifier-reversibilite-migrations) — remplacée par un seul appel au workflow réutilisable.
  # Un `workflow_call` exécute les jobs du fichier appelé DANS le run de l'appelant, sans exiger
  # que ci.yml ait tourné séparément : ça couvre exactement le cas qui justifiait la copie (un
  # push de tag ne déclenche jamais ci.yml par ses propres `on:`). La duplication de code
  # disparaît ; la duplication d'EXÉCUTION sur un push main a existé un temps (ci.yml tournait
  # pour son propre déclencheur ET dans cet appel, deux suites testcontainers simultanées sur le
  # même runner à 2 cœurs) et causait des checks rouges au hasard, pas seulement du gaspillage —
  # voir le commentaire du bloc `on:` de ci.yml pour la preuve mesurée (commit d21452a) et le
  # correctif du 10.08.2026 : `main` retiré de `push.branches` dans ci.yml, cet appel
  # `workflow_call` est désormais la SEULE exécution des jobs de qualité sur un push main.
  verification-qualite:
    name: Vérification qualité (ci.yml)
    uses: ./.github/workflows/ci.yml

  # --- Construction et publication -----------------------------------------------------------
  # Une image publiée est une image potentiellement déployée (docker-compose.yml n'a aucun
  # garde-fou qui distingue une image « bonne » d'une image « mauvaise » au moment du
  # déploiement) : ce job ne démarre donc que si les trois jobs de qualité ci-dessus réussissent —
  # y compris la réversibilité des migrations (voir son job dans ci.yml). `needs` sur un job
  # `uses:` attend la réussite de TOUS les jobs qu'il contient, pas seulement du premier en échec :
  # un job de ci.yml qui échoue fait échouer `verification-qualite` dans son ensemble.
  construire-publier:
    name: Construire et publier dfa-${{ matrix.image }} (registre forge)
    needs: [verification-qualite]
    runs-on: ubuntu-latest
    # `contents: read` seulement : ce job clone le dépôt (historique complet, voir plus bas) et
    # pousse vers le registre de conteneurs avec un jeton personnel dédié (secret
    # REGISTRE_IMAGES_TOKEN, voir l'étape d'authentification plus bas), jamais avec le jeton
    # d'exécution automatique du workflow. Sur forge, ce jeton automatique (l'équivalent de
    # GITHUB_TOKEN) n'obtient PAS l'accès en écriture au registre de paquets même avec
    # `packages: write` déclaré ici — limitation connue du runner (forge/forge#1296) — donc ce
    # bloc ne déclare que ce qui sert réellement. Pas d'`id-token`/`attestations: write` non plus :
    # l'étape de signature Sigstore a été retirée, voir son remplacement plus bas.
    permissions:
      contents: read
    strategy:
      # Un échec sur l'image web ne doit pas empêcher de savoir si l'image api, elle, est publiable
      # (et inversement) : les deux builds sont indépendants.
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
          - image: web
            dockerfile: apps/web/Dockerfile
    steps:
      # `fetch-depth: 0` (historique complet), PAS le défaut de actions/checkout@v4 (1 seul
      # commit) : l'étape "Déterminer le tag d'image et la version applicative" ci-dessous calcule
      # VERSION_APP à partir de `git rev-list --count HEAD` (nombre total de commits, voir
      # apps/api/src/config/version-app.ts pour le même calcul côté développement) — sur un clone
      # superficiel, cette commande ne compterait que les commits réellement présents localement
      # (1, toujours) au lieu du vrai total, et le correctif de version n'avancerait jamais.
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Un registre de conteneurs OCI s'adresse par host[:port], jamais par une URL avec schéma.
      # `github.server_url` est le ROOT_URL de l'instance forge (ex. http://192.168.1.10:3300,
      # déjà ce que le label `org.opencontainers.image.source` utilise plus bas) : on le réutilise
      # ici plutôt que de coder l'hôte en dur, pour que ce fichier survive sans modification à un
      # changement d'adresse de l'instance (ex. le jour où elle passe derrière un vrai nom de
      # domaine). Le registre de paquets de forge vit sous le MÊME hôte que le reste de
      # l'instance (`/v2/…`, distinct de l'API REST `/api/v1/…`), contrairement à GitHub où
      # ghcr.io est un hôte séparé de github.com.
      - name: Hôte du registre de conteneurs
        id: registre
        env:
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          HOTE="${SERVER_URL#http://}"
          HOTE="${HOTE#https://}"
          HOTE="${HOTE%/}"
          echo "hote=${HOTE}" >> "$GITHUB_OUTPUT"

      # Le registre de conteneurs exige un chemin d'image strictement en minuscules (comme
      # ghcr.io en son temps) ; `github.repository_owner` peut contenir des majuscules.
      - name: Nom du propriétaire en minuscule (exigence du registre)
        id: repo
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # `github.ref_name` (nom du tag Git) est en théorie une valeur fournie par qui pousse le
      # tag : on la fait transiter par `env:` plutôt que de l'interpoler directement dans le
      # script `run:`, pour ne pas l'exposer à une injection de commande shell (recommandation de
      # sécurité standard GitHub Actions pour toute valeur issue du contexte `github.*`).
      #
      # Cette étape calcule EN PLUS `version_app`/`version_app_branche` — les deux variables lues
      # par le schéma zod de configuration (apps/api/src/config/charger-config.ts) et exposées par
      # `GET /sante` (pied de la barre latérale : « main 0.1.234 »). Injectées comme build-args
      # Docker (voir l'étape "Construire et publier l'image" plus bas) puisque le conteneur de
      # production n'a pas de `.git` pour les calculer lui-même à l'exécution.
      #   - VERSION_APP = MAJEUR.MINEUR du package.json racine (bump manuel, jamais recalculé
      #     ici) + CORRECTIF = nombre total de commits (`git rev-list --count HEAD`, strictement
      #     croissant, incrémente à CHAQUE commit) + hash court en métadonnée semver (`+abcdef1`).
      #     Même schéma qu'en développement (`calculerVersionAppParDefaut`, version-app.ts), pour
      #     qu'un numéro observé en production se recoupe avec le même calcul fait localement.
      #   - VERSION_APP_BRANCHE = `github.ref_name` directement, JAMAIS une commande git — c'est
      #     ce qui évite le piège du HEAD détaché : un checkout par tag (`actions/checkout@v4` sur
      #     un push de tag) laisse le dépôt en HEAD détaché, où `git rev-parse --abbrev-ref HEAD`
      #     rendrait littéralement `HEAD` (inutilisable pour le support). `github.ref_name` rend
      #     directement `main` sur un push de branche et le tag lui-même (ex. `v0.4.2`) sur un push
      #     de tag — jamais `HEAD`, dans les deux cas.
      - name: Déterminer le tag d'image et la version applicative
        id: image-tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          SHA_COURT=$(git rev-parse --short HEAD)
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG="main-${SHA_COURT}"
          fi
          MAJEUR_MINEUR=$(jq -r '.version' package.json | cut -d. -f1,2)
          NOMBRE_COMMITS=$(git rev-list --count HEAD)
          VERSION_APP="${MAJEUR_MINEUR}.${NOMBRE_COMMITS}+${SHA_COURT}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha_court=${SHA_COURT}" >> "$GITHUB_OUTPUT"
          echo "version_app=${VERSION_APP}" >> "$GITHUB_OUTPUT"
          echo "version_app_branche=${REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authentification au registre de conteneurs
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registre.outputs.hote }}
          username: ${{ github.actor }}
          # PAS secrets.GITHUB_TOKEN : sur forge, le jeton d'exécution automatique du workflow
          # n'a pas accès en écriture au registre de paquets, quel que soit le bloc `permissions:`
          # du job — limitation connue et documentée du runner (forge/forge#1296), pas encore
          # vérifiée par un run réel sur CE dépôt (aucun accès CI/CD disponible pour le faire
          # pendant la préparation de ce correctif — à confirmer à la première publication réelle,
          # voir le rapport de ce correctif). Il faut donc un jeton d'accès PERSONNEL
          # forge (Paramètres du compte @laupernoe → Applications → Générer un nouveau jeton — PAS un
          # jeton limité à ce dépôt : la portée « package » n'existe que sur les jetons personnels
          # classiques), avec la portée « package » en Lecture et écriture, déposé comme secret du
          # DÉPÔT (Réglages du dépôt → Actions → Secrets) sous le nom REGISTRE_IMAGES_TOKEN.
          # Nom contraint par forge : lettres/chiffres/underscores uniquement, jamais un préfixe
          # réservé (FORGE_/GITEA_/GITHUB_) ni un chiffre en tête — d'où ce nom en français plutôt
          # qu'un nom calqué sur « forge » ou « GitHub ».
          password: ${{ secrets.REGISTRE_IMAGES_TOKEN }}

      # Contexte de build = racine du dépôt (`.`), jamais apps/api ou apps/web : les deux
      # Dockerfiles l'exigent (pnpm workspaces + packages/shared, voir leurs en-têtes). Un
      # `context: apps/api` ou `apps/web` ici ferait échouer `pnpm install --frozen-lockfile` dès
      # la première étape du Dockerfile, faute de voir pnpm-lock.yaml/pnpm-workspace.yaml.
      #
      # Une seule plateforme, linux/amd64 : Infomaniak et Exoscale (les deux hébergeurs suisses
      # visés, voir docs/deploiement-production.md §2) ne proposent que du x86_64 en Compute/VM.
      # Construire aussi linux/arm64 impliquerait l'émulation QEMU (beaucoup plus lent) pour une
      # plateforme qu'aucun environnement de déploiement ne consomme — le poste de dev
      # Windows/WSL2 de @laupernoe n'entre pas en ligne de compte ici, ces images ne tournent jamais sur
      # son poste, seulement sur le serveur de prod.
      #
      # `provenance: false` : désactive l'attestation de provenance interne (non signée) que
      # buildx attache par défaut au manifeste lors d'un push, qui transformerait chaque image en
      # manifeste multi-plateforme même en single-arch. Anciennement gardé à `false` pour laisser
      # la place à UNE attestation signée via Sigstore/GitHub OIDC (étape qui suivait ce job) —
      # cette étape a disparu (voir plus bas pourquoi), mais la valeur reste : elle garde
      # `docker-compose.yml` face à un manifeste d'image simple, sans surprise pour la version
      # de Docker Engine installée sur le serveur.
      - name: Construire et publier l'image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          provenance: false
          # VERSION_APP/VERSION_APP_BRANCHE : seule apps/api/Dockerfile déclare ces ARG (voir son
          # commentaire) — l'image web n'en a aucun usage (sa propre version vient d'un appel à
          # l'API au runtime, jamais d'une valeur figée au build, voir apps/web/src/hooks/
          # useVersionApplication.ts). Les lignes ci-dessous s'évaluent à une chaîne vide pour
          # `matrix.image == 'web'` — build-push-action ignore les lignes vides d'une liste
          # multiligne, aucun `--build-arg` n'est alors passé à cette image.
          build-args: |
            ${{ matrix.image == 'api' && format('VERSION_APP={0}', steps.image-tag.outputs.version_app) || '' }}
            ${{ matrix.image == 'api' && format('VERSION_APP_BRANCHE={0}', steps.image-tag.outputs.version_app_branche) || '' }}
          tags: |
            ${{ steps.registre.outputs.hote }}/${{ steps.repo.outputs.owner }}/dfa-${{ matrix.image }}:${{ steps.image-tag.outputs.tag }}
            ${{ steps.registre.outputs.hote }}/${{ steps.repo.outputs.owner }}/dfa-${{ matrix.image }}:sha-${{ steps.image-tag.outputs.sha_court }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image-tag.outputs.tag }}
          # Cache en cache=registre plutôt que `type=gha` : le backend `gha` de buildx dépend d'un
          # service de cache compatible `actions/cache` exposé par le runner via les variables
          # d'environnement ACTIONS_CACHE_URL/ACTIONS_RUNTIME_TOKEN — sur forge, ce service est
          # une fonctionnalité serveur à activer explicitement par l'administrateur du runner
          # (bloc `[cache]` de sa config), pas garantie active ici et pas vérifiable depuis ce
          # fichier. `type=registry` ne dépend que du registre de conteneurs lui-même (déjà
          # nécessaire pour publier l'image), donc aucune dépendance supplémentaire à vérifier.
          # Tag `:cache` séparé du tag immuable de l'image (voir `tags:` ci-dessus) : PUREMENT
          # interne au build, JAMAIS référencé par docker-compose.yml ni par un déploiement —
          # il peut donc rester mutable sans contredire la règle « jamais de tag mouvant » du
          # commentaire d'en-tête, qui porte sur les images déployables. Une portée par image (api
          # et web ne partagent pas les mêmes couches, Dockerfiles différents) : chacune son propre
          # tag `:cache`, sinon l'une écraserait le cache de l'autre à chaque run.
          cache-from: type=registry,ref=${{ steps.registre.outputs.hote }}/${{ steps.repo.outputs.owner }}/dfa-${{ matrix.image }}:cache
          cache-to: type=registry,ref=${{ steps.registre.outputs.hote }}/${{ steps.repo.outputs.owner }}/dfa-${{ matrix.image }}:cache,mode=max,image-manifest=true

      # Attestation de provenance SLSA (Sigstore) — RETIRÉE (20.08.2026), pas seulement
      # neutralisée par un `if:`, cette fois : `actions/attest-build-provenance` n'a plus de sens
      # possible hors GitHub, pour deux raisons structurelles, pas une panne temporaire :
      #   1. L'action appelle en dur l'API REST de GitHub (`POST /repos/.../attestations`,
      #      api.github.com) pour enregistrer l'attestation — il n'existe aucune option pour
      #      pointer cet appel vers une autre forge. forge n'expose pas d'API équivalente.
      #   2. La signature keyless Sigstore repose sur la fédération OIDC GitHub Actions ↔ Fulcio
      #      (Sigstore) : Fulcio ne fait confiance qu'à l'émetteur OIDC de GitHub pour délivrer un
      #      certificat de signature. Le jeton OIDC d'un run forge Actions (même avec
      #      `id-token: write`) n'est pas cet émetteur — Fulcio le rejetterait.
      # Contrairement à l'obstacle précédent (dépôt privé, potentiellement levable un jour sans
      # toucher ce fichier), celui-ci ne se lève pas de lui-même : il faudrait une infrastructure
      # de signature séparée (ex. cosign avec une paire de clés auto-hébergée, ou un Rekor privé)
      # — un nouveau projet en soi, pas demandé ici, donc pas fait. Un `if:` à `false` aurait
      # laissé une étape durablement grisée dans chaque run, pour une fonctionnalité qui ne
      # reviendra pas sans décision explicite : la supprimer est plus honnête que la neutraliser.
      # Les images restent publiées, taguées et immuables (voir l'étape précédente) — seule la
      # signature de provenance disparaît.
