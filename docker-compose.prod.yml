# Production DFA : Postgres + Redis + API + front + reverse proxy, TOUT en conteneurs sur le(s)
# serveur(s) propres de @laupernoe (aucun service managé par un hébergeur — décision actée : ni
# Infomaniak ni Exoscale ne portent la base de données ou le cache). Voir
# docs/deploiement-production.md pour tout ce que cette décision change par rapport à un
# Postgres/Redis managé : sauvegardes, montée de version, chiffrement au repos, TLS, ce qui
# n'est raisonnablement pas atteignable seul.
#
# Aucun `build:` ici pour `api`/`web` : le déploiement consiste à pointer `API_IMAGE`/`WEB_IMAGE`
# sur une image déjà construite et taguée par la CI (`.github/workflows/publier-images.yml`),
# jamais à compiler sur le serveur — c'est ce qui rend le rollback trivial (redéployer le tag
# précédent, voir docs/deploiement-production.md §Retour arrière). `postgres`/`redis`, eux,
# utilisent directement les images officielles (mêmes tags que docker-compose.yml de dev, pour
# ne jamais tester une version différente de celle qui tourne en production).
#
# `name:` fixe le nom de projet Compose indépendamment du chemin de checkout sur le serveur —
# les noms de conteneurs/réseau/volumes restent stables même si le dépôt est un jour recloné
# dans un autre dossier. Important à 2h du matin : `docker ps`/`docker compose logs` doivent
# toujours montrer les mêmes noms, peu importe qui a déployé où.
name: dfa-prod

# Toutes les valeurs variables (images, domaine, e-mail ACME, secrets applicatifs ET secrets
# d'infrastructure — mots de passe Postgres/Redis, désormais sous notre responsabilité) viennent
# de l'environnement — AUCUN secret n'est écrit dans ce fichier, qui est versionné dans Git. En
# pratique : `docker compose -f docker-compose.yml --env-file .env.production <commande>`,
# où `.env.production` (jamais commité — déjà couvert par `.env.*` dans .gitignore) sert un
# double rôle documenté dans docs/deploiement-production.md :
#   1. interpolation des `${VARIABLE}` de CE fichier au moment du `docker compose config`/`up` ;
#   2. injection des mêmes variables DANS le conteneur `api` via `env_file:` (c'est le fichier
#      que lit ensuite le schéma zod de apps/api/src/config au démarrage du process).
# Toute variable requise utilise la forme `${VAR:?message}` : Compose refuse de démarrer avec un
# message clair plutôt que de lancer un service à moitié configuré — même philosophie fail-closed
# que la validation zod de l'API elle-même.
#
# CE FICHIER NE SUFFIT PLUS SEUL SUR LE SERVEUR (différence avec la version managée précédente) :
# `postgres` monte `docker/postgres/init/01-roles.sql` en lecture seule au même chemin relatif
# que le docker-compose.yml de dev. Il faut donc un checkout du dépôt sur le serveur (ex.
# `git clone --branch <tag> --depth 1`), pas seulement une copie de ce fichier — voir
# docs/deploiement-production.md §4.

x-logging: &logging-defaut
  # json-file avec rotation : suffisant pour un seul opérateur qui lit `docker compose logs`
  # (pas encore d'agrégation centralisée, voir docs/deploiement-production.md §Monitoring).
  # Bornée en taille pour ne jamais remplir le disque du serveur silencieusement.
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

x-restart-defaut: &restart-defaut unless-stopped

x-securite-defaut: &securite-defaut
  # Empêche un process du conteneur de regagner des privilèges (ex. via un binaire setuid) même
  # s'il est compromis. Ne casse rien pour des images qui ne s'appuient pas là-dessus.
  - no-new-privileges:true

services:
  # --- PostgreSQL (données applicatives) --------------------------------------------------
  # Réintégré ici (absent de la version managée précédente) : sur ses propres serveurs, @laupernoe est
  # responsable du cycle de vie complet — versions, tuning mémoire, volumes, sauvegardes (§7 du
  # doc), montée de version majeure (§3.7 du doc). Même image/tag que docker-compose.yml de dev
  # (postgres:16-alpine) : jamais une version testée en dev différente de celle qui tourne ici.
  postgres:
    image: postgres:16-alpine
    container_name: dfa-postgres
    restart: *restart-defaut
    environment:
      # `dfa` est le rôle SUPERUSER de bootstrap (identique en nom à docker-compose.yml de dev),
      # utilisé UNIQUEMENT pour l'initialisation du conteneur et la rotation ponctuelle de mots
      # de passe (docs/deploiement-production.md §3.2/§8) — l'API ne s'y connecte JAMAIS (voir
      # docker/postgres/init/01-roles.sql, qui explique pourquoi un superuser contournerait
      # silencieusement le RLS). Nom FIXÉ ici (constante versionnée, changement par revue Git),
      # seul le mot de passe vient de .env.production.
      POSTGRES_USER: dfa
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Définir POSTGRES_SUPERUSER_PASSWORD (mot de passe fort et dédié, jamais réutilisé) dans .env.production}
      # Nom de base FIXÉ ici pour la même raison que NODE_ENV/PORT sur le service `api` plus bas :
      # un `.env.production` mal renseigné ne doit jamais pouvoir faire pointer un déploiement
      # vers une base différente de celle attendue.
      POSTGRES_DB: dfa_prod
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C.UTF-8'
    volumes:
      - dfa_postgres_data:/var/lib/postgresql/data
      # Strictement identique au mécanisme de dev : ne s'exécute qu'à l'initdb d'un volume vide.
      # Crée dfa_migrator/dfa_app avec les mots de passe de DEV (dfa_migrator_dev/dfa_app_dev) —
      # c'est attendu au tout premier démarrage (réseau interne, encore inaccessible depuis
      # Internet à ce stade) : la procédure de première mise en production (doc §4) les fait
      # tourner vers des valeurs fortes IMMÉDIATEMENT après, avant d'ouvrir `reverse-proxy` au
      # public. Simplification notable par rapport à la base managée précédente : plus besoin de
      # rejouer ce script à la main via psql contre un hébergeur, le conteneur le fait lui-même
      # comme en dev. Filet en cas d'oubli de cette rotation : ces deux mots de passe de dev
      # expirent d'eux-mêmes 7 jours après ce démarrage sur la base `dfa_prod` (voir le script SQL
      # lui-même et docs/deploiement-production.md §3.2/§8) — un déploiement qui a oublié la
      # rotation tombe en panne visible plutôt que de tourner indéfiniment avec des identifiants
      # publics.
      - ./docker/postgres/init/01-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    # Réglages mémoire/connexions pour un premier serveur de départ (hypothèse : 8 Go RAM / 4
    # vCPU dédiés à Postgres, cohérent avec `deploy.resources` ci-dessous). Valeurs hardcodées et
    # versionnées (changement par revue Git) plutôt que variables d'environnement cachées — même
    # philosophie que les limites CPU/mémoire des autres services. À RECALCULER si le gabarit réel
    # du serveur diffère (méthode : https://pgtune.leopard.in.ua/, profil "Web application", en
    # ajustant `max_connections` à la réalité de DATABASE_POOL_MAX ci-dessous plutôt qu'au défaut
    # de l'outil) — voir docs/deploiement-production.md §3.7.
    #   - shared_buffers = 25 % de la RAM allouée à Postgres.
    #   - effective_cache_size = 75 % (estimation du cache disque que l'OS gardera disponible).
    #   - max_connections = 50 : largement au-dessus de DATABASE_POOL_MAX (10, .env.example) +
    #     le rôle `migrate` (jamais concurrent avec lui-même, verrou consultatif) + une marge pour
    #     une session psql manuelle d'astreinte à 2h du matin.
    #   - log_min_duration_statement : journalise toute requête > 1s vers stdout (donc vers
    #     `docker compose logs postgres`, capturé par le driver json-file comme le reste) — c'est
    #     tout le monitoring de requêtes lentes dont ce projet a besoin au stade actuel, sans
    #     outil supplémentaire (philosophie §0 : ne pas complexifier avant besoin réel).
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - work_mem=20MB
      - -c
      - wal_buffers=16MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_connections=50
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=1000
    # Aucun `ports:` : contrairement à docker-compose.yml (dev), Postgres n'est PAS publié sur
    # l'hôte. Seul `api`/`migrate` (réseau `interne`) le joignent. Pour une session psql manuelle
    # depuis le serveur : `docker compose -f docker-compose.yml --env-file .env.production
    # exec postgres psql -U dfa -d dfa_prod` — jamais besoin d'exposer le port pour ça, voir
    # docs/deploiement-production.md §11.
    networks:
      - interne
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dfa -d dfa_prod']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    # Laisse le temps à un CHECKPOINT propre avant l'envoi de SIGKILL — un arrêt brutal de
    # Postgres n'est jamais destructeur grâce au WAL (récupération au redémarrage), mais un arrêt
    # propre est plus rapide à redémarrer et évite de dépendre de la relecture du WAL.
    stop_grace_period: 60s
    security_opt: *securite-defaut
    # PAS de `cap_drop: [ALL]` ici (contrairement à `api`/`web`, nos propres images) — même
    # exception documentée que `reverse-proxy` plus bas : l'entrypoint officiel de l'image
    # `postgres` a besoin, au tout premier démarrage sur un volume vide, de `chown` le répertoire
    # de données avant de basculer sur l'utilisateur `postgres` (uid non-root) en interne. Retirer
    # CAP_CHOWN casserait l'initialisation elle-même, redécouvert seulement à la toute première
    # mise en production. `no-new-privileges` reste appliqué.
    logging: *logging-defaut
    deploy:
      resources:
        # Cohérent avec les réglages `command:` ci-dessus (shared_buffers=2GB) : la limite laisse
        # de la marge au-dessus pour le cache OS et les connexions actives, sans laisser Postgres
        # déborder sur la mémoire réservée à `api`/`web`/`redis` sur le même hôte.
        limits:
          cpus: '2.0'
          memory: 3G
        reservations:
          cpus: '1.0'
          memory: 2560M

  # --- Redis (cache + files BullMQ) --------------------------------------------------------
  # Réintégré pour la même raison que `postgres` : plus de Redis managé. Persistance AOF comme en
  # dev (docker-compose.yml) : les jobs BullMQ en attente ne doivent pas disparaître à un
  # redémarrage de conteneur.
  redis:
    image: redis:7-alpine
    container_name: dfa-redis
    restart: *restart-defaut
    environment:
      # Utilisée UNIQUEMENT par le CLIENT `redis-cli` du HEALTHCHECK ci-dessous — `REDISCLI_AUTH`
      # est lue automatiquement par `redis-cli`, contrairement à l'option `-a <mot-de-passe>` qui
      # exposerait le mot de passe en clair dans `ps aux`/`/proc/<pid>/cmdline` À CHAQUE exécution
      # du healthcheck (toutes les 10s). Le SERVEUR `redis-server` ne lit pas cette variable : son
      # mot de passe vient exclusivement du fichier `redis.conf` monté ci-dessous (`configs:`),
      # jamais d'un argument `command:` ni d'une variable d'environnement du process serveur —
      # correctif d'audit (secrets en argv visibles via `ps aux`, `docker inspect`, `docker
      # compose config` : voir docs/deploiement-production.md §Rotation des secrets).
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Définir REDIS_PASSWORD dans .env.production}
    # Fichier de config plutôt qu'argument `--requirepass` sur la ligne de commande (voir
    # `configs:` en bas de ce document pour le contenu, interpolé exactement comme le Caddyfile
    # inline du service `reverse-proxy`) : un argument de ligne de commande du process 1 d'un
    # conteneur est lisible EN CLAIR par tout compte du système hôte via `/proc/1/cmdline` et
    # `ps aux` — aucune permission Docker requise — et réapparaît dans `docker inspect`/`docker
    # compose config`, commande qui figure dans la procédure de diagnostic de
    # docs/deploiement-production.md §11 et qu'on colle volontiers dans un ticket. Un fichier
    # monté en lecture seule, propriété de l'utilisateur `redis` de l'image officielle (uid/gid
    # 999 — voir `configs:` plus bas) et non lisible par les autres utilisateurs, n'apparaît dans
    # aucun des trois écrans ci-dessus.
    command: ['redis-server', '/usr/local/etc/redis/redis.conf']
    configs:
      # uid/gid 999 : convention stable de l'image officielle `redis:7-alpine` (utilisateur
      # `redis`, vers lequel l'entrypoint officiel abaisse ses privilèges avant d'exécuter
      # `redis-server`). NOTE (limite connue, à vérifier au premier déploiement réel — non
      # vérifiable sans lancer de conteneur, hors périmètre de cette tâche, même limite que le
      # `cap_drop` de `postgres`/`redis` ci-dessous) : si cette convention d'uid changeait ou
      # était mal supposée, `redis-server` échouerait à lire ce fichier au démarrage avec une
      # erreur explicite dans `docker compose logs redis` (jamais un échec silencieux) — dans ce
      # cas, retirer `uid:`/`gid:`/`mode:` pour retomber sur le défaut Compose (racine, 0444,
      # lisible par tous les utilisateurs du conteneur) le temps d'investiguer.
      - source: redis-conf
        target: /usr/local/etc/redis/redis.conf
        uid: '999'
        gid: '999'
        mode: 0400
    volumes:
      - dfa_redis_data:/data
    # Aucun `ports:` : même raisonnement que `postgres`, accessible uniquement depuis `api` sur
    # le réseau `interne`.
    networks:
      - interne
    healthcheck:
      # `redis-cli` lit `REDISCLI_AUTH` (défini ci-dessus dans `environment:`) tout seul — plus
      # besoin de `-a "$$REDIS_PASSWORD"` en argument, qui exposait le mot de passe dans `ps aux`
      # du conteneur à chaque exécution du healthcheck.
      test: ['CMD-SHELL', 'redis-cli ping 2>/dev/null | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    security_opt: *securite-defaut
    # Même exception que `postgres` : l'image officielle bascule elle-même sur un utilisateur non
    # root en interne après une préparation qui suppose certaines capacités par défaut ; non
    # vérifiable sans lancer de conteneur (hors périmètre de cette tâche), donc pas de
    # `cap_drop: [ALL]` ici — voir la note équivalente sur `postgres` ci-dessus.
    logging: *logging-defaut
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # --- Initialisation des permissions du volume de sauvegardes (job ponctuel, idempotent) ----
  # Même besoin, même solution que `init-uploads-pdf` plus bas : un volume Docker NOMMÉ fraîchement
  # créé appartient à root:root par défaut, et le service `backup` tourne en utilisateur non-root
  # DÉDIÉ (uid/gid 10001, fixés explicitement dans docker/postgres/sauvegarde/Dockerfile — voir son
  # commentaire) qui ne peut alors pas y écrire sans ce correctif préalable.
  init-sauvegardes:
    container_name: dfa-init-sauvegardes
    image: busybox:1.36
    command: ['sh', '-c', 'chown -R 10001:10001 /sauvegardes && chmod -R u+rwX /sauvegardes']
    volumes:
      - dfa_postgres_backups:/sauvegardes
    restart: 'no'
    security_opt: *securite-defaut
    logging: *logging-defaut

  # --- Sauvegarde nocturne de PostgreSQL (locale, chiffrée, vérifiée, tournante) --------------
  # Sauvegarde logique quotidienne (`pg_dump --format=custom`, plus compacte et plus fiable à
  # restaurer sélectivement qu'un dump SQL brut : restauration table par table possible,
  # compression zlib intégrée, ordre de restauration résolu automatiquement par pg_restore même si
  # des contraintes se référencent entre elles) — exécutée par un service DÉDIÉ (image construite
  # depuis docker/postgres/sauvegarde/, voir son Dockerfile pour le détail de chaque paquet
  # installé) qui se planifie LUI-MÊME (docker/postgres/sauvegarde/planifier.sh, une boucle bash,
  # pas un cron/systemd — cohérent avec le choix « TOUT en conteneurs » de ce fichier).
  #
  # DÉCISION ACTÉE (@laupernoe) : sauvegarde LOCALE uniquement, sur le volume `dfa_postgres_backups`
  # ci-dessous. Aucun envoi hors site n'est fait par ce service — c'est @laupernoe qui recopie
  # périodiquement ce volume ailleurs, par le moyen de son choix (rsync, disque externe, etc.).
  # Une seule sauvegarde par nuit (pas de PITR/archivage continu du WAL à ce stade) : le compromis
  # accepté aujourd'hui est de perdre au pire une journée de travail — à revoir en chantier séparé
  # quand plusieurs garages réels factureront sur cette base.
  #
  # CHIFFREMENT AU REPOS (nLPD, données personnelles de clients suisses) : asymétrique via `age`
  # (déjà l'outil retenu par ce dépôt avant ce chantier, voir l'historique Git de
  # docker/postgres/sauvegarde/). Seule la clé PUBLIQUE (AGE_CLE_PUBLIQUE) vit sur ce serveur, dans
  # .env.production — la clé PRIVÉE correspondante ne s'y trouve JAMAIS : sans elle, un fichier de
  # ce volume ne révèle rien, y compris si le serveur entier était compromis. Elle doit être
  # générée hors de ce serveur (`age-keygen`) et conservée par @laupernoe dans un endroit qui n'est PAS ce
  # volume ni ce serveur (gestionnaire de mots de passe, clé USB hors ligne) — sortie uniquement le
  # temps d'une restauration réelle (docker/postgres/sauvegarde/restaurer.sh) ou d'un test mensuel
  # (docker/postgres/sauvegarde/restaurer-test.sh).
  #
  # POSTGRES_MIGRATOR_PASSWORD : variable DÉDIÉE plutôt que de réutiliser `DATABASE_URL_MIGRATION`
  # tel quel — `pg_dump`/`pg_restore` prennent un mot de passe via la variable d'environnement
  # `PGPASSWORD` (jamais un argument de commande, invisible de `ps aux`/`docker inspect`), pas une
  # URL de connexion complète. Même mot de passe que celui déjà encodé dans
  # `DATABASE_URL_MIGRATION` (rôle `dfa_migrator`) — à garder synchronisé en cas de rotation,
  # exactement comme `REDIS_PASSWORD` est déjà à la fois une variable autonome (service `redis`
  # ci-dessus) ET un composant de `REDIS_URL` utilisé par `api`.
  backup:
    container_name: dfa-backup
    build:
      context: ./docker/postgres/sauvegarde
      dockerfile: Dockerfile
    restart: *restart-defaut
    environment:
      TZ: Europe/Zurich
      PGHOST: postgres
      PGPORT: '5432'
      PGDATABASE: dfa_prod
      PGUSER: dfa_migrator
      PGPASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?Définir POSTGRES_MIGRATOR_PASSWORD (mot de passe du rôle dfa_migrator — même valeur que celle encodée dans DATABASE_URL_MIGRATION) dans .env.production}
      AGE_CLE_PUBLIQUE: ${AGE_CLE_PUBLIQUE:?Définir AGE_CLE_PUBLIQUE (clé PUBLIQUE age, générée hors serveur avec age-keygen — jamais la clé privée ici) dans .env.production}
      HEURE_SAUVEGARDE: ${HEURE_SAUVEGARDE:-03:15}
      SEUIL_TAILLE_MIN_POURCENT: ${SEUIL_TAILLE_MIN_POURCENT:-50}
    volumes:
      - dfa_postgres_backups:/sauvegardes
    # `tmpfs` (mémoire, jamais le disque) plutôt qu'un volume ordinaire : c'est ici, et
    # SEULEMENT ici, que le dump PostgreSQL existe en clair le temps de sa vérification
    # structurelle avant chiffrement — voir docker/postgres/sauvegarde/sauvegarder.sh pour le
    # raisonnement complet. Mode 1777 (comme /tmp) plutôt que restreint à l'utilisateur du
    # conteneur : Docker crée un `tmpfs:` appartenant à root, qu'un conteneur non-root ne peut
    # sinon pas écrire sans un service d'initialisation supplémentaire — périmètre de confiance
    # inchangé, ce tmpfs n'est accessible qu'à l'intérieur de CE conteneur, à aucun autre.
    # Taille à ajuster (variable ci-dessous) si la base applicative grossit sensiblement : le
    # dump `--format=custom` est déjà compressé, donc proche en taille du fichier chiffré final,
    # PAS de la taille de la base en clair.
    tmpfs:
      - /scratch:mode=1777,size=${BACKUP_TMPFS_TAILLE:-1g}
    networks:
      - interne
    depends_on:
      postgres:
        condition: service_healthy
      init-sauvegardes:
        condition: service_completed_successfully
    healthcheck:
      # Sonde de vie du planificateur (voir docker/postgres/sauvegarde/verifier-vivant.sh) — ne
      # prouve PAS qu'une sauvegarde a réussi cette nuit, seulement que le service tourne. Le
      # verdict sur la dernière sauvegarde est dans /sauvegardes/dernier-statut.txt et
      # /sauvegardes/journal.log, sur le volume `dfa_postgres_backups` — à consulter directement
      # (`docker compose ... exec backup cat /sauvegardes/dernier-statut.txt`), volontairement
      # séparé du healthcheck Docker (un échec de sauvegarde n'est pas résolu par un redémarrage
      # de conteneur, ça ne doit donc pas en déclencher un).
      test: ['CMD', '/scripts/verifier-vivant.sh']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt: *securite-defaut
    # Utilisateur non-root dédié de bout en bout (voir docker/postgres/sauvegarde/Dockerfile) ;
    # aucune capacité Linux particulière requise (pas de port, pas de chown au runtime).
    cap_drop:
      - ALL
    logging: *logging-defaut
    deploy:
      resources:
        # La limite mémoire doit rester AU-DESSUS de la taille du tmpfs ci-dessus (`/scratch`
        # compte dans la mémoire du cgroup du conteneur, comme tout tmpfs Linux) — sinon le
        # conteneur serait tué par l'OOM killer au premier dump qui approche cette taille.
        limits:
          cpus: '1.0'
          memory: 1536M
        reservations:
          cpus: '0.1'
          memory: 128M

  # --- Initialisation des permissions du volume PDF (job ponctuel, idempotent) ---------------
  # `api` génère et met en cache les PDF de facture sur disque (`StockagePdfDisqueLocal`,
  # apps/api/src/facturation/impression/stockage-pdf.ts) sous `<cwd>/uploads/documents-pdf`, soit
  # `/repo/apps/api/uploads/documents-pdf` dans l'image (apps/api/Dockerfile fixe `WORKDIR
  # /repo/apps/api` juste avant `CMD`).
  #
  # CORRECTIF D'AUDIT (rien de tout ceci n'existait avant) : ce répertoire n'était monté sur AUCUN
  # volume — chaque recréation du conteneur `api` (chaque déploiement applicatif, §6
  # docs/deploiement-production.md) effaçait silencieusement tous les PDF déjà générés. Grave :
  # `ServiceImpressionFacture.obtenirPdf` (service-impression-facture.ts) NE régénère PAS un PDF
  # manquant quand `document.pdfCle` est déjà posé en base — `stockage.lire(cle)` lève une erreur
  # de fichier absent non rattrapée, ce n'est pas un cache-miss qui retombe silencieusement sur le
  # payload figé. Sans ce volume, retélécharger une facture déjà émise après un simple
  # redéploiement rendait donc une 500. Signalé séparément pour correction côté
  # `apps/api/src/facturation/impression/` (hors périmètre infrastructure de ce fichier) : cette
  # absence de repli reste un défaut applicatif même une fois ce volume en place — ce correctif-ci
  # protège seulement contre la perte du fichier au niveau infrastructure, pas contre une future
  # cause de fichier manquant côté code.
  #
  # Volume nommé `dfa_api_uploads` (ordinaire, voir `volumes:` en bas de ce fichier) — SUFFISANT et
  # volontairement PAS un stockage objet (S3) à ce stade (philosophie §0 : ne pas complexifier
  # avant besoin réel) : une seule instance `api` sur un seul hôte, et la donnée de RÉFÉRENCE reste
  # le payload QR figé en base (`document_vente`, voir docs/design-impression-facture-qr.md) — le
  # PDF sur ce volume n'est qu'un CACHE de ce payload. Conséquences assumées de ce choix :
  #   - Sauvegarde : ce volume n'entre PAS dans la procédure §7 (qui ne sauvegarde que Postgres).
  #     Ce n'est pas un oubli : tant que le correctif applicatif ci-dessus n'est pas fait, une
  #     perte de ce volume reste une INDISPONIBILITÉ temporaire de téléchargement (pas une perte de
  #     donnée métier), à traiter en régénérant manuellement via une requête applicative une fois
  #     le correctif posé. Si ce correctif tarde durablement, réévaluer : inclure ce volume dans la
  #     sauvegarde chiffrée devient alors la mitigation la plus simple en attendant.
  #   - Montée en charge horizontale : si DFA passe un jour à PLUSIEURS instances `api`, ce volume
  #     local cesse d'être suffisant (chaque instance verrait un cache différent, un client
  #     pourrait générer sur une instance et lire sur une autre qui ne l'a jamais vu) — bascule vers
  #     un stockage objet S3-compatible (Infomaniak/Exoscale) à CE moment-là, pas avant.
  #
  # Pourquoi un service séparé plutôt qu'un `chown` posé une fois dans apps/api/Dockerfile : `api`
  # tourne déjà non-root, sans capacité Linux (`cap_drop: [ALL]` plus bas), et un volume Docker
  # NOMMÉ fraîchement créé est root:root par défaut — l'utilisateur `dfa` de l'image (uid 100, gid
  # 101, VÉRIFIÉ empiriquement contre `node:22-alpine` : `addgroup -S dfa && adduser -S dfa -G dfa`
  # dans apps/api/Dockerfile attribue ces valeurs sur l'image actuelle, `docker run --rm <image> id
  # dfa`) ne peut alors pas y écrire (`mkdir: Permission denied`, reproduit puis corrigé par ce
  # service avant d'écrire ce correctif — voir la preuve dans le rapport d'audit). Un `chown` posé
  # une seule fois au build de l'image ne protège que si Docker recopie fidèlement les permissions
  # de l'image dans le volume à sa toute première initialisation — comportement réel mais fragile à
  # supposer sans le revérifier à chaque changement d'image de base ou de driver de stockage. Ce
  # service `chown` donc EXPLICITEMENT le volume à chaque démarrage (idempotent, coût de quelques
  # millisecondes) plutôt que de dépendre de ce mécanisme implicite.
  #
  # FRAGILITÉ CONNUE, à surveiller : l'uid/gid (100/101) en dur ci-dessous est celui attribué par
  # Alpine à la PREMIÈRE paire utilisateur/groupe système créée dans l'image `node:22-alpine`
  # actuelle (aucun autre `adduser`/`addgroup` avant `dfa` dans apps/api/Dockerfile aujourd'hui) —
  # si ce Dockerfile change un jour l'ordre de création des utilisateurs système, ou change de base
  # image, cette valeur doit être revérifiée (`docker run --rm <image> id dfa`) et mise à jour ici.
  # Fixer un uid/gid EXPLICITE au `adduser` (`-u 10001 -g 10001`) supprimerait cette fragilité
  # définitivement — changement dans `apps/api/Dockerfile`, hors périmètre d'écriture de cette
  # tâche (docker/ et ce fichier uniquement), signalé pour correction ultérieure.
  init-uploads-pdf:
    container_name: dfa-init-uploads-pdf
    image: busybox:1.36
    command: ['sh', '-c', 'chown -R 100:101 /uploads && chmod -R u+rwX /uploads']
    volumes:
      - dfa_api_uploads:/uploads
    # Pas de `networks:` : ce job ne parle à aucun autre conteneur, uniquement au volume monté.
    restart: 'no'
    # PAS de `cap_drop: [ALL]` ici, même exception documentée que `postgres`/`redis` plus haut :
    # `chown` a besoin de CAP_CHOWN/CAP_FOWNER, présentes dans le jeu de capacités par défaut d'un
    # conteneur root ordinaire, retirées par un `cap_drop: [ALL]`.
    security_opt: *securite-defaut
    logging: *logging-defaut

  # --- API (NestJS) --------------------------------------------------------------------------
  api:
    container_name: dfa-api
    image: ${API_IMAGE:?Définir API_IMAGE (ex. ghcr.io/dmsforall/api:v0.4.2) dans .env.production}
    restart: *restart-defaut
    # `.env.production` porte TOUTES les variables validées par apps/api/src/config (schéma
    # zod) : DATABASE_URL/DATABASE_URL_MIGRATION (rôles dfa_app/dfa_migrator, hôte `postgres` —
    # nom de service Compose, résolu par le DNS interne du réseau `interne`), REDIS_URL (hôte
    # `redis`, avec mot de passe, voir plus haut), secrets de session, etc. Rien de tout cela ne
    # transite par ce fichier.
    env_file:
      - .env.production
    environment:
      # Ces deux valeurs sont FIXÉES ici plutôt que laissées à .env.production, en défense en
      # profondeur — `environment:` a priorité sur `env_file:` dans Compose :
      #   - NODE_ENV : un `.env.production` copié-collé depuis `.env.example` (qui vaut
      #     `development`) ne doit jamais faire tourner l'API en mode dev par accident. La
      #     validation zod exige déjà COOKIE_SECURE=true quand NODE_ENV=production — encore
      #     faut-il que NODE_ENV soit effectivement `production`.
      #   - PORT : doit rester 3000 car le Caddyfile ci-dessous (bloc `configs`) cible
      #     l'upstream fixe `api:3000`. Le rendre configurable via .env.production casserait le
      #     routage du reverse proxy sans erreur visible (juste des 502).
      - NODE_ENV=production
      - PORT=3000
    # PDF de facture mis en cache — voir le commentaire détaillé sur `init-uploads-pdf` ci-dessus
    # (pourquoi ce volume, ce qu'il couvre, ce qu'il ne couvre pas). Chemin exact attendu par
    # `StockagePdfDisqueLocal` (apps/api/src/facturation/impression/stockage-pdf.ts) sous
    # `process.cwd()` = `/repo/apps/api` (WORKDIR fixé par apps/api/Dockerfile juste avant `CMD`).
    volumes:
      - dfa_api_uploads:/repo/apps/api/uploads/documents-pdf
    # Aucun `ports:` : l'API n'est joignable que par les autres conteneurs de ce réseau (le
    # reverse proxy). Le seul point d'entrée public de toute la stack est le service
    # `reverse-proxy` ci-dessous.
    networks:
      - interne
    # `depends_on` sur `postgres`/`redis` EN PLUS de `condition: service_healthy` : différence
    # structurante avec la version managée précédente, où ces deux dépendances étaient hors de ce
    # fichier et donc invisibles de Compose. Ici, Compose sait que `postgres`/`redis` doivent être
    # sains AVANT de démarrer `api` — utile en particulier au tout premier démarrage d'un hôte
    # (volume vide, initdb en cours). `GET /api/v1/sante` (le HEALTHCHECK de l'image, hérité tel
    # quel — jamais redéfini ici pour éviter une divergence avec apps/api/Dockerfile) continue de
    # ne vérifier aucune dépendance externe, exprès : un Postgres/Redis brièvement indisponible
    # APRÈS le démarrage initial (ex. `docker compose restart postgres` pour appliquer un nouveau
    # `command:`) ne doit pas faire redémarrer l'API en boucle. C'est `GET /api/v1/sante/pret` qui
    # vérifie Postgres et Redis en continu — réservé à la supervision externe (uptime check), voir
    # docs/deploiement-production.md §Monitoring.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Garantit que le volume `dfa_api_uploads` est déjà accessible en écriture par l'utilisateur
      # `dfa` (uid 100) avant que `api` ne démarre — voir le commentaire détaillé sur
      # `init-uploads-pdf` ci-dessus. `service_completed_successfully` : `api` attend que ce job
      # ponctuel se soit terminé avec un code de sortie 0, pas qu'il tourne en continu (il ne
      # tourne jamais en continu, `restart: 'no'`).
      init-uploads-pdf:
        condition: service_completed_successfully
    stop_grace_period: 30s
    security_opt: *securite-defaut
    # L'image tourne déjà en utilisateur non-root dédié (USER dfa, apps/api/Dockerfile) et n'a
    # besoin d'aucune capacité Linux particulière (port 3000, pas de bind privilégié, pas de
    # chown) : on les retire toutes.
    cap_drop:
      - ALL
    logging: *logging-defaut
    deploy:
      resources:
        # Valeurs de départ pour un premier premier garage — à ajuster ici (fichier versionné,
        # changement passant par une revue Git plutôt qu'une variable d'environnement cachée) une
        # fois le gabarit réel du serveur connu. `docker compose up` (Compose v2, hors Swarm)
        # applique bien ces limites, ce n'est pas réservé à `docker stack deploy`.
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # --- Migrations (job ponctuel, jamais démarré par un `docker compose up` normal) -----------
  # Réutilise EXACTEMENT la même image que le service `api` (même tag, donc même code compilé) :
  # les migrations appliquées sont toujours celles que la version déployée attend, aucun risque
  # de décalage entre le schéma migré et le code qui tourne. `dist/db/migrer.js` (nest build
  # compile src/db/migrer.ts) se connecte avec DATABASE_URL_MIGRATION (rôle dfa_migrator),
  # jamais DATABASE_URL — voir apps/api/src/db/migrer.ts.
  #
  # `profiles:` l'exclut d'un `docker compose up` normal : il faut l'invoquer explicitement,
  # voir docs/deploiement-production.md §Migrations :
  #   docker compose -f docker-compose.yml --env-file .env.production \
  #     --profile migration run --rm migrate
  migrate:
    image: ${API_IMAGE:?Définir API_IMAGE (ex. ghcr.io/dmsforall/api:v0.4.2) dans .env.production}
    profiles: ['migration']
    command: ['node', 'dist/db/migrer.js']
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
    networks:
      - interne
    depends_on:
      postgres:
        condition: service_healthy
    security_opt: *securite-defaut
    cap_drop:
      - ALL
    logging: *logging-defaut

  # --- Front (SPA statique servie par nginx) --------------------------------------------------
  web:
    container_name: dfa-web
    image: ${WEB_IMAGE:?Définir WEB_IMAGE (ex. ghcr.io/dmsforall/web:v0.4.2) dans .env.production}
    restart: *restart-defaut
    # Pas de `env_file:` : les variables `VITE_*` sont inlinées dans le bundle AU BUILD (voir
    # apps/web/Dockerfile, `ARG VITE_API_URL`), le conteneur nginx ne lit aucune variable
    # d'environnement au runtime. Un changement de VITE_API_URL exige une nouvelle image, jamais
    # un redémarrage de conteneur avec une variable différente.
    networks:
      - interne
    security_opt: *securite-defaut
    # Déjà non-root de bout en bout (USER nginx, apps/web/Dockerfile) ; nginx n'a besoin d'aucune
    # capacité particulière sur le port non privilégié 8080.
    cap_drop:
      - ALL
    logging: *logging-defaut
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M

  # --- Reverse proxy public (Caddy) -----------------------------------------------------------
  # Seul service exposé sur l'hôte. Termine le TLS (HTTPS automatique via Let's Encrypt), route
  # sur un DOMAINE UNIQUE : `/api/*` vers `api:3000`, tout le reste vers `web:8080` — c'est
  # l'architecture que supposent déjà apps/web/nginx.conf (CSP `connect-src 'self'`,
  # VITE_API_URL=/api/v1 en chemin relatif) et apps/web/Dockerfile (« le front est toujours
  # servi derrière le même reverse proxy que l'API »). En clair : API_URL_PUBLIQUE et
  # WEB_URL_PUBLIQUE (.env.production) doivent pointer vers la MÊME origine publique — voir
  # docs/deploiement-production.md §Domaine et CORS.
  #
  # TRUST_PROXY_HOPS (.env.production, lu par l'API) doit valoir 1 ici : Caddy est l'unique
  # reverse proxy entre Internet et le conteneur `api`.
  #
  # AUCUN fournisseur ne termine plus le TLS en amont de Caddy (ça n'a d'ailleurs jamais changé :
  # Caddy a toujours géré Let's Encrypt lui-même, même sous l'hypothèse managée précédente). Ce
  # qui change réellement en auto-hébergement : il n'y a plus de load balancer/CDN d'hébergeur en
  # frontal pour absorber une panne réseau, et si le serveur qui héberge ce conteneur est chez lui
  # ou en colocation, la joignabilité des ports 80/443 depuis Internet (IP publique fixe, pas de
  # CGNAT, ports non bloqués par le FAI) est un prérequis SILENCIEUX dont dépend tout le
  # renouvellement ACME — voir docs/deploiement-production.md §5 (TLS) pour la checklist et le
  # comportement en cas d'échec de renouvellement.
  #
  # Le Caddyfile est fourni en `configs:` avec `content:` INLINE plutôt qu'en fichier séparé —
  # ce n'est pas une préférence de style : ce déploiement ne doit ajouter QUE ce fichier
  # docker-compose.yml et docs/deploiement-production.md (et, depuis la réintégration de
  # Postgres/Redis, docker/postgres/init/01-roles.sql — déjà présent dans le dépôt), aucun
  # fichier de configuration tiers. `content:` est interpolé par Compose exactement comme le
  # reste de ce document, donc `${WEB_URL_PUBLIQUE}` et `${ACME_EMAIL}` ci-dessous viennent de
  # .env.production — attention, c'est la syntaxe Compose `${VAR}`, PAS la syntaxe native de
  # substitution de Caddy `{$VAR}` (les deux sont d'ailleurs volontairement incompatibles en
  # apparence, donc sans collision possible : Compose ne touche jamais à un `{$VAR}` littéral).
  reverse-proxy:
    container_name: dfa-reverse-proxy
    # Épinglée en version majeure seulement, comme postgres:16-alpine/redis:7-alpine ci-dessus —
    # le tag mineur suit les correctifs de sécurité en amont.
    image: caddy:2-alpine
    restart: *restart-defaut
    ports:
      - '80:80'
      - '443:443'
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      # Persistance OBLIGATOIRE : `caddy_data` contient les certificats Let's Encrypt émis.
      # Sans volume nommé, chaque recréation du conteneur redemanderait un certificat neuf —
      # Let's Encrypt impose des quotas hebdomadaires par domaine, largement atteignables en
      # quelques redéploiements successifs sans ce volume.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - interne
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    # NOTE (limite connue, à durcir plus tard) : l'image officielle `caddy:2-alpine` tourne en
    # root (nécessaire pour lier les ports 80/443 sans capacité ajoutée) et ne fournit pas
    # d'utilisateur non-root alternatif prêt à l'emploi — contrairement à `api`/`web`, qui sont
    # nos propres images. `no-new-privileges` reste appliqué ; un `cap_drop: [ALL]` n'est
    # volontairement PAS ajouté ici : impossible de vérifier sans lancer de conteneur (hors
    # périmètre de cette tâche) l'ensemble minimal de capacités dont Caddy a besoin pour
    # renouveler ses certificats, et un mauvais réglage casserait silencieusement le TLS en
    # production. À reprendre avec une image Caddy construite maison si ce point devient
    # bloquant pour une certification/conformité.
    security_opt: *securite-defaut
    healthcheck:
      # Cible l'API d'administration de Caddy (liée à 127.0.0.1:2019 par défaut, jamais publiée
      # sur l'hôte) plutôt qu'une route HTTPS publique : reste vert même pendant la négociation
      # initiale d'un certificat ACME (qui peut prendre plusieurs secondes), et ne dépend donc
      # pas de la disponibilité de `api`/`web` en aval — même logique que le HEALTHCHECK de
      # l'API elle-même (sonde de vie, pas de disponibilité des dépendances).
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging: *logging-defaut
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M

networks:
  # Réseau bridge ordinaire, PAS `internal: true` : `reverse-proxy` doit conserver un accès
  # sortant vers les serveurs ACME de Let's Encrypt. L'isolation recherchée ici (postgres/redis/
  # api/web injoignables depuis l'hôte ou Internet) vient de l'absence de `ports:` sur ces quatre
  # services, pas d'un réseau fermé — `postgres`/`redis` eux-mêmes n'ont d'ailleurs besoin
  # d'AUCUN accès sortant (ni migré ni managé à distance), contrairement à la version précédente
  # où l'API sortait vers un hébergeur externe pour les joindre.
  interne:

configs:
  caddyfile:
    content: |
      {
        email ${ACME_EMAIL:?Définir ACME_EMAIL (notifications d'expiration Let's Encrypt) dans .env.production}
      }

      ${WEB_URL_PUBLIQUE:?Définir WEB_URL_PUBLIQUE (ex. https://app.dmsforall.example) dans .env.production} {
        encode gzip

        header {
          # Seul endroit de toute la stack où HSTS est posé (voir apps/web/nginx.conf, qui
          # l'omet explicitement au profit d'ici) : Caddy est le seul point qui sait avec
          # certitude que la connexion cliente est en HTTPS.
          Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
        }

        # `/api/*` vers l'API ; tout le reste (SPA + assets statiques) vers le front — les noms
        # `api`/`web` sont les noms de service Compose ci-dessus, résolus par le DNS interne du
        # réseau `interne`.
        handle /api/* {
          reverse_proxy api:3000
        }

        handle {
          reverse_proxy web:8080
        }
      }

  # Contenu inline pour la même raison que `caddyfile` ci-dessus : ce déploiement n'ajoute AUCUN
  # fichier tiers au dépôt, tout part de `.env.production` interpolé par Compose. `requirepass`
  # ici plutôt que dans `command:` du service `redis` — voir le commentaire détaillé sur ce
  # service (correctif d'audit, secrets en argv).
  redis-conf:
    content: |
      requirepass ${REDIS_PASSWORD:?Définir REDIS_PASSWORD dans .env.production}
      appendonly yes

volumes:
  # `dfa_postgres_data`/`dfa_redis_data` : nouveaux par rapport à la version managée précédente.
  # Volumes Docker nommés ORDINAIRES — AUCUN chiffrement au repos de leur propre fait. Le
  # chiffrement au repos exigé par le nLPD (docs/deploiement-production.md §2) doit venir d'une
  # couche EN DESSOUS de Docker (LUKS sur le disque/partition qui héberge
  # /var/lib/docker/volumes) : un volume nommé, seul, ne suffit pas à l'argument de conformité.
  dfa_postgres_data:
  dfa_redis_data:
  caddy_data:
  caddy_config:
  # PDF de facture mis en cache par `api` — voir le commentaire détaillé sur le service
  # `init-uploads-pdf` (ci-dessus, section `services:`) pour ce que ce volume couvre, ce qu'il n'a
  # PAS besoin de couvrir (sauvegarde) et sa limite connue (une seule instance `api`).
  dfa_api_uploads:
  # Sauvegardes PostgreSQL chiffrées (voir le service `backup` ci-dessus). Volume Docker nommé
  # ORDINAIRE — comme `dfa_postgres_data` plus haut, AUCUN chiffrement au repos de son propre fait :
  # celui exigé par le nLPD vient de `age` (contenu déjà chiffré avant d'atteindre ce volume, voir
  # `backup`), pas d'une couche de chiffrement disque ici. Local à CE serveur : @laupernoe est responsable
  # de recopier périodiquement son contenu hors site (décision actée, voir le commentaire du
  # service `backup`) — un incendie/vol/dégât des eaux qui détruit ce serveur détruit aussi ce
  # volume, la copie hors site est ce qui protège de CE scénario précis, pas ce volume lui-même.
  dfa_postgres_backups:
