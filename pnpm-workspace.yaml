packages:
  - 'apps/*'
  - 'packages/*'
# Scripts de post-installation autorisés. pnpm les bloque par défaut : un script
# d'installation s'exécute avec les droits de l'utilisateur, c'est le vecteur classique de
# compromission de chaîne d'approvisionnement. On n'autorise donc que le strict nécessaire.
allowBuilds:
  # Indispensable : télécharge le binaire natif utilisé par Vite, Vitest et tsx.
  esbuild: true
  # Génère le service worker de MSW, utilisé par les tests du front.
  msw: true
  # Dépendance de testcontainers ; sans son build, le chargement retombe sur du JS pur.
  protobufjs: true
  # Télémétrie tierce : refusée, elle n'apporte rien au projet.
  '@scarf/scarf': false
  # Accélérations natives optionnelles de ssh2 (via testcontainers). Refusées : elles
  # exigeraient une chaîne de compilation C++ sous Windows, et ssh2 fonctionne sans.
  cpu-features: false
  ssh2: false
  # Binaire natif du compilateur SWC, requis par Vitest pour émettre les métadonnées de
  # décorateurs sans lesquelles l'injection de dépendances NestJS ne se résout pas en test.
  '@swc/core': true
  # Accélération native optionnelle de l'encodage msgpack utilisé par BullMQ (jobs
  # d'ordonnancement, voir apps/api/src/ordonnancement/). Refusée, même doctrine que
  # cpu-features/ssh2 ci-dessus : msgpackr retombe proprement sur une implémentation JS pure
  # sans ce binaire natif, pour un job planifié une fois par jour le coût est négligeable.
  msgpackr-extract: false
# Surcharges de sécurité. pnpm 11 ne lit plus le champ "pnpm.overrides" de package.json ;
# ce bloc est son remplaçant.
overrides:
  # @nestjs/swagger@11.4.6 pin js-yaml en 5.2.1 EXACT (pas de range) -> GHSA-pm4m-ph32-ghv5,
  # HIGH, déni de service par parsing exponentiel dans les collections "flow" de YAML.
  # Aucune version publiée de @nestjs/swagger ne desserre ce pin (vérifié le 10.08.2026,
  # dernière version = 11.4.6, identique à celle installée). Retirer cette ligne dès que
  # @nestjs/swagger publie une release avec js-yaml >=5.2.2 (`npm view @nestjs/swagger
  # dependencies` pour vérifier), ou dès qu'on migre vers un générateur OpenAPI qui n'en
  # dépend pas.
  '@nestjs/swagger>js-yaml': '>=5.2.2'
  # Dependabot 12.08.2026, dépendances de dev uniquement (aucun chemin de production) :
  #
  # - brace-expansion : minimatch en tire trois lignes majeures incompatibles (1.x via
  #   eslint/@nestjs/cli, 2.x via testcontainers/archiver et openapi-typescript/@redocly,
  #   5.x via typescript-eslint et @nestjs/cli/rimraf). Chaque ligne a un correctif publié
  #   dans sa propre majeure ; pas de dépendance directe unique à monter pour les trois à la
  #   fois, d'où trois sélecteurs plutôt qu'une seule contrainte globale (qui casserait les
  #   lignes majeures qui n'en ont pas besoin).
  'brace-expansion@1': '^1.1.18'
  'brace-expansion@2': '^2.1.4'
  'brace-expansion@5': '^5.0.9'
  # - js-yaml (instances 4.x, distinctes du pin @nestjs/swagger ci-dessus) : @redocly/openapi-
  #   core@1.x (tiré par openapi-typescript, génération des types API front) épingle
  #   js-yaml en 4.2.0 EXACT ; @redocly/openapi-core@2.x corrige déjà (js-yaml >=5.2.2) mais
  #   openapi-typescript@7.13.0 (dernière version, vérifié le 12.08.2026) dépend encore de
  #   ^1.34.6. Retirer cette ligne quand openapi-typescript migre vers @redocly/openapi-core
  #   2.x (`pnpm info openapi-typescript dependencies` pour vérifier).
  'js-yaml@4': '^4.3.1'
  # - nanoid : postcss (via vite/webpack, outillage de build) l'autorise déjà (^3.3.16) ;
  #   simple retard de résolution, pas de pin en cause. Override par simplicité plutôt que
  #   forcer une résolution complète du graphe.
  'nanoid@3': '^3.3.18'
  # - esbuild : @esbuild-kit/core-utils (tiré par drizzle-kit, CLI de migration) épingle
  #   esbuild en ~0.18.20. Le paquet @esbuild-kit est déprécié (remplacé par tsx, déjà présent
  #   par ailleurs) et drizzle-kit@0.31.10 (dernière version, vérifié le 12.08.2026) le tire
  #   encore. Retirer cette ligne quand drizzle-kit abandonne @esbuild-kit/esm-loader.
  'esbuild@0.18.20': '^0.25.12'
  # Audit prod 05.11.2026 : paquets Express tirés par @nestjs/platform-express@11, qui les
  # borne par des ranges trop bas. Correctifs dans la même majeure ; retirer ces lignes quand
  # le lockfile résout naturellement ces versions (`pnpm why multer`).
  multer: '>=2.5.0'
  body-parser: '>=2.4.0'
  proxy-addr: '>=2.0.8'
  # ajv (via @hookform/resolvers > ajv-formats) : correctif fast-uri dans la même majeure 3.x.
  fast-uri: '>=3.1.7 <4'
